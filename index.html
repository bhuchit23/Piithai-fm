<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E131A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Piithai FM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Piithai FM 2027</title>
<style>
:root{--bg:#0E131A;--nav:#121922;--top:#111821;--card:#161E28;--card2:#1B2430;--line:#222C38;--line2:#2A3544;--tx:#E6EBF1;--tx2:#C3CCD7;--mut:#9AA6B5;--dim:#7D8896;--acc:#4FD1A5;--acc2:#7FE3C1;--accbg:#15302A;--gold:#F5C76B;--bad:#F2836B;--warn:#F2A07F;--blue:#6FB7F2;--away:#E8A33D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit}
a{color:var(--acc2)}
#app{display:flex;min-height:100vh}
#nav{flex:0 0 232px;background:var(--nav);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.crest{border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#0E131A;flex:none}
.nv{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;color:var(--tx2);font-size:14px;border:none;background:none;text-align:left;cursor:pointer;width:100%}
.nv svg{flex:none}
.nv.on{background:#1D2733;color:var(--tx);font-weight:600}
.nv.on svg{stroke:var(--acc)}
.badge{margin-left:auto;background:var(--acc);color:#0E131A;font-size:12px;font-weight:700;border-radius:10px;padding:1px 8px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line);background:var(--top);position:sticky;top:0;z-index:5}
#top h1{margin:0;font-size:21px}
.sub{font-size:12px;color:var(--mut)}
.grow{flex:1}
.btn{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#0B1015;font-weight:700}
.btn.soft{background:var(--accbg);border-color:#2E5C4E;color:var(--acc2)}
.btn.danger{background:#3A1F1A;border-color:#5C2E26;color:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line2);background:var(--card);color:var(--tx2);font-weight:600;font-size:14px;cursor:pointer}
.pill.on{background:var(--acc);border-color:var(--acc);color:#0B1015}
.view{padding:20px 26px;display:flex;flex-direction:column;gap:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{margin:0;font-size:13px;font-weight:600;color:var(--mut);letter-spacing:.04em}
.kv{display:flex;justify-content:space-between;align-items:center;min-height:38px;border-bottom:1px solid #1E2733;font-size:14px;gap:10px}
.kv>span:first-child{color:var(--tx2)}
.kv b{font-weight:600}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mut);font-size:12px;font-weight:500;text-align:left;padding:11px 8px;background:#131A23;white-space:nowrap}
th.s{cursor:pointer}
td{padding:9px 8px;border-top:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#1A2330}
tr.me td{background:var(--accbg);font-weight:700}
tr.sel td{background:#1B2532}
.r{text-align:right}
.pos{display:inline-block;min-width:40px;text-align:center;padding:3px 6px;border-radius:4px;font-size:12px;font-weight:700;color:#0B1015}
.pG{background:var(--gold)}.pD{background:var(--blue)}.pM{background:var(--acc2)}.pF{background:var(--warn)}
.st{color:var(--gold);letter-spacing:1px}.st2{color:#8C7A4F;letter-spacing:1px}
.tag{font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px;margin-left:6px;color:#0B1015}
.t-inj{background:var(--bad)}.t-sus{background:var(--gold)}.t-xi{background:var(--acc2)}
.bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;width:56px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.frm{display:flex;gap:6px}
.frm span{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.W{background:var(--acc);color:#0B1015}.D{background:#5A6676;color:#F0F3F6}.L{background:var(--bad);color:#0B1015}
.msg{display:flex;gap:12px;padding:12px;border-radius:8px;cursor:pointer;border:none;background:none;color:var(--tx);text-align:left;width:100%}
.msg.unread{background:#1B2532}
.msg .d{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:#3A4656}
.msg.unread .d{background:var(--acc)}
.mut{color:var(--mut)}.dim{color:var(--dim)}.good{color:var(--acc2)}.badc{color:var(--warn)}.gold{color:var(--gold)}
.attr{display:flex;justify-content:space-between;min-height:29px;align-items:center;border-bottom:1px solid #1E2733;font-size:14px}
.attr>span:first-child{color:var(--tx2)}
.a1{color:var(--dim)}.a2{color:var(--tx2)}.a3{color:#9FDCC4;font-weight:500}.a4{color:var(--acc);font-weight:700}.a5{color:var(--gold);font-weight:700}
.pitch{position:relative;border-radius:12px;background:#143024;border:2px solid #2D5A45;overflow:hidden}
.pitch .ln{position:absolute;border:2px solid #2D5A45}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:104px;border:none;background:none;color:var(--tx);cursor:pointer;padding:0}
.slot .c{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#0B1015;border:2px solid #0E131A}
.slot.on .c{outline:3px solid #fff}
.slot .n{background:#0E131AE6;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600;line-height:1.35;text-align:center;max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .n small{display:block;font-weight:400;color:#9FDCC4}
.inp{min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:#0E131A;color:var(--tx);font-size:15px;width:100%}
label.l{font-size:13px;color:var(--tx2);display:flex;flex-direction:column;gap:6px}
.kpi{display:flex;flex-direction:column;gap:3px}
.kpi b{font-size:22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.open{display:flex}
#modal .box{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
#modal h3{margin:0;font-size:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1D2733;border:1px solid var(--line2);color:var(--tx);padding:12px 18px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw}
.score{font-size:30px;font-weight:700;letter-spacing:2px}
.minute{font-size:13px;font-weight:700;color:#0B1015;background:var(--gold);border-radius:4px;padding:0 8px}
canvas{display:block;width:100%;border-radius:12px}
.feed{max-height:420px;overflow-y:auto}
.fe{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #1E2733;font-size:14px;line-height:1.5}
.fe b{min-width:32px}
.club{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);cursor:pointer;text-align:left;width:100%}
.club.on{border-color:var(--acc);background:var(--accbg)}
.sched{display:grid;grid-template-columns:64px repeat(7,minmax(0,1fr));gap:6px;font-size:13px;min-width:620px}
.sched span{min-height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;padding:4px}
.bars{display:flex;align-items:flex-end;gap:14px;height:200px;border-bottom:1px solid var(--line2);padding:0 6px}
.bars>div{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:4px;height:100%}
.bars i{width:30%;max-width:28px;border-radius:4px 4px 0 0;display:block}
@media (max-width:760px){
  #app{flex-direction:column}
  #nav{position:sticky;top:0;z-index:10;height:auto;flex:none;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;border-right:none;border-bottom:1px solid var(--line)}
  .brand{display:none}
  .nv{width:auto;white-space:nowrap;flex:none;padding:0 10px}
  #top{position:static;padding:12px 16px}
  .view{padding:16px}
}

/* ---------- ส่วนเสริมของเกมหลัก (ใช้โทเค็นเดียวกับสเปก) ---------- */
#stash{display:none}
.nv:focus-visible,.btn:focus-visible,.pill:focus-visible,.club:focus-visible,tr.click:focus-visible,.msg:focus-visible,.slot:focus-visible,.inp:focus-visible,summary:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.sbteam{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:14px}
.sbmid{display:flex;flex-direction:column;align-items:center;gap:6px}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#0B1015;font-weight:700;overflow:hidden;flex:0 0 auto}
.avatar img{width:100%;height:100%;object-fit:cover}
.cbadge{width:52px;height:52px;font-size:14px}
.face{width:28px;height:28px;font-size:11px}
ul#log{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
ul#log li.goal{color:var(--gold);font-weight:700}
#stats table{width:100%}
#stats th{background:none;color:var(--mut);text-align:center;font-weight:500}
#stats td{text-align:center;font-weight:600}
.lineh{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--mut)}
.prow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px;border-bottom:1px solid #1E2733}
.pinfo{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{color:var(--mut);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.sub2{font-size:12px;color:var(--dim)}
.ctr{text-align:center}
.nowrap{white-space:nowrap}
.sortable{cursor:pointer}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.chk input{width:22px;height:22px}
textarea.inp{min-height:88px;padding:10px 12px;resize:vertical}
.filebtn{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.filebtn input{display:none}
.filebtn:focus-within{outline:2px solid var(--acc2);outline-offset:2px}
.hint{background:var(--accbg);border:1px solid #2E5C4E;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--tx2)}
.rep{white-space:pre-line;font-size:14px;line-height:1.7;color:var(--tx2)}
.knd{font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px;color:#0B1015;background:var(--mut);white-space:nowrap}
.k-injury{background:var(--bad)}.k-transfer{background:var(--blue)}.k-contract{background:var(--gold)}.k-training{background:var(--acc2)}.k-event{background:var(--warn)}.k-league{background:var(--mut)}.k-report{background:var(--acc)}
.res{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;font-weight:700;font-size:12px}
.res.W{background:var(--acc);color:#0B1015}.res.D{background:#5A6676;color:#F0F3F6}.res.L{background:var(--bad);color:#0B1015}
.meter{height:10px;border-radius:5px;background:var(--line2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc)}
.grade{font-size:40px;font-weight:700;line-height:1}
.pos.pX{background:var(--mut)}
.slot.fit-main .c{background:var(--acc2)}.slot.fit-ok .c{background:var(--gold)}.slot.fit-bad .c{background:var(--bad)}
.ppitch{position:relative;width:100%;max-width:240px;aspect-ratio:68/105;border-radius:10px;background:#143024;border:2px solid #2D5A45;margin:0 auto}
.ppitch i{position:absolute;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:700;color:#0B1015;background:#3A4656;opacity:.55}
.ppitch i.f1{background:var(--acc2);opacity:1}.ppitch i.f2{background:var(--gold);opacity:1}.ppitch i.f3{background:var(--bad);opacity:1}
.sticky-note{font-size:12px;color:var(--dim)}
@media (max-width:760px){
  .sb{gap:4px}
  .grade{font-size:32px}
  .slot{width:76px}
  .slot .n{max-width:76px;font-size:11px}
  .score{font-size:26px}
}

/* ปุ่มที่หน้าตาเป็นลิงก์ (ชื่อนักเตะ ฯลฯ) */
.lnk{background:none;border:0;padding:0;margin:0;color:var(--tx);font:inherit;font-weight:600;cursor:pointer;text-align:left;min-height:0}
.lnk:hover{color:var(--acc2)}
.lnk:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:3px}

</style>
</head>
<body>
<div id="app"><nav id="nav" aria-label="เมนูหลัก"></nav><main id="main"><header id="top"></header><div id="view" class="view"></div></main></div>
<div id="modal"></div>

<!-- ชิ้นส่วนที่ย้ายเข้าไปแสดงในหน้าจอตามต้องการ (ui.js ย้ายกลับมาเก็บที่นี่ก่อนวาดหน้าใหม่) -->
<div id="stash">
  <div class="hint" id="installHint" role="note" style="display:none">
    <b>ติดตั้งเป็นแอป</b>
    <div style="margin:4px 0 10px">กดปุ่มแชร์ (ไอคอนสี่เหลี่ยมมีลูกศรขึ้น) ใน Safari แล้วเลือก "เพิ่มไปยังหน้าจอโฮม" จะได้ไอคอนเปิดเต็มจอ เล่นออฟไลน์ได้ แนะนำให้ดาวน์โหลดไฟล์เซฟสำรองไว้เป็นระยะ</div>
    <button class="btn sm" id="installHintClose" type="button">เข้าใจแล้ว</button>
  </div>

  <section class="card" id="singlePane" aria-label="แมตช์เดี่ยว">
    <h2>แมตช์เดี่ยว (เลือกสองทีมใดก็ได้)</h2>
    <div class="grid2">
      <label class="l">ทีมเหย้า<select id="homeSel" class="inp"></select></label>
      <label class="l">แผนทีมเหย้า<select id="homeForm" class="inp"></select></label>
      <label class="l">ทีมเยือน<select id="awaySel" class="inp"></select></label>
      <label class="l">แผนทีมเยือน<select id="awayForm" class="inp"></select></label>
    </div>
    <div class="pills">
      <button id="startBtn" class="btn soft" type="button">เริ่มแมตช์</button>
      <button id="skipBtn" class="btn" type="button">ข้ามไปจบ</button>
    </div>
  </section>

  <section class="card" id="dataPane" aria-label="ข้อมูลนักเตะ">
    <h2>ข้อมูลนักเตะและสโมสร</h2>
    <div class="sub" id="dataStatus" role="status"></div>
    <div class="pills">
      <label class="filebtn">โหลดไฟล์ข้อมูล (pl_2026_27.json หรือ players.json + clubs.json)<input id="fileInput" type="file" accept=".json,application/json" multiple></label>
      <button id="clearBtn" class="btn" type="button">ใช้ข้อมูลตัวอย่าง</button>
    </div>
  </section>

  <section id="matchPane" aria-label="แมตช์สด">
    <div class="card">
      <div class="sb">
        <div class="sbteam"><div id="badgeHome"></div><span id="nameHome"></span></div>
        <div class="sbmid"><div class="score" id="sbScore" role="status" aria-live="polite">0 - 0</div><span class="minute" id="sbMin">&nbsp;</span></div>
        <div class="sbteam"><div id="badgeAway"></div><span id="nameAway"></span></div>
      </div>
      <div class="pills" role="group" aria-label="ความเร็วการเล่น" style="justify-content:center">
        <button class="pill on" data-speed="1" aria-pressed="true" type="button">1x</button>
        <button class="pill" data-speed="2" aria-pressed="false" type="button">2x</button>
        <button class="pill" data-speed="4" aria-pressed="false" type="button">4x</button>
        <button class="pill" data-speed="8" aria-pressed="false" type="button">8x</button>
      </div>
    </div>
    <div class="card" style="margin-top:18px"><canvas id="pitch" role="img" aria-label="ภาพสนาม 2 มิติ แสดงตำแหน่งผู้เล่นและลูกบอลระหว่างแมตช์"></canvas></div>
    <div class="grid" style="margin-top:18px">
      <div class="card"><h2>เหตุการณ์</h2><ul id="log" aria-live="polite"></ul></div>
      <div class="card"><h2>สถิติ</h2><div id="stats" class="sub">เล่นแมตช์เพื่อดูสถิติ</div></div>
    </div>
    <div class="grid" id="lineups" style="margin-top:18px">
      <div class="card" id="lineHome"></div>
      <div class="card" id="lineAway"></div>
    </div>
  </section>
</div>

<script>
/* เอนจินจำลองแมตช์: ตัวเลขล้วน ไม่ใช้ AI
 * ใช้ได้ทั้งในเบราว์เซอร์ (window.FMEngine) และ Node (module.exports) */
(function (root) {
  'use strict';

  var FORMATIONS = {
    '4-4-2': { DEF: 4, MID: 4, FWD: 2 },
    '4-3-3': { DEF: 4, MID: 3, FWD: 3 },
    '3-5-2': { DEF: 3, MID: 5, FWD: 2 },
    '4-5-1': { DEF: 4, MID: 5, FWD: 1 }
  };
  var LINE_X = { GK: 5, DEF: 24, MID: 47, FWD: 72 };
  var HALF_WIDTH = { 1: 0, 2: 10, 3: 20, 4: 24, 5: 26 };

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function lineSlots(pos, n) {
    var slots = [];
    for (var i = 0; i < n; i++) {
      var y = n === 1 ? 34 : 34 + (i - (n - 1) / 2) * (2 * HALF_WIDTH[n] / (n - 1));
      slots.push({ pos: pos, x: LINE_X[pos], y: y });
    }

  function layout(formation) {

    if (forced && forced.length === slots.length) {

  function teamRatings(xi) {

      return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : 50;

   * form = ความผันผวนฟอร์มวันแข่งของแต่ละทีม, shot/goal = ฐานโอกาสยิง/เข้า, power = เลขชี้กำลังของอัตราส่วนความแข็งแกร่ง,

      away: { xi: awayXI, r: teamRatings(awayXI), adv: 1, f: 1 + (rng() + rng() - 1) * TUNE.form, m: (opts.mentality && opts.mentality.away) || 0 }

    for (var m = 1; m <= total; m++) {

      stats[s].possMin++;

      /* ทีมที่เหลือผู้เล่นน้อยลง (ใบแดง) บุกแย่ลงและป้องกันแย่ลง */
      /* แนวทางการเล่น (-2 รับเหนียว ... +2 บุกหนัก): บุกมากขึ้นแต่เปิดช่องรับ */
      var ratio = (side[s].r.attack * side[s].f * side[s].adv * (1 + MENT_ATT * side[s].m) * Math.pow(0.9, reds[s])) /

        }

      }

      if (rng() < 0.035) {
        var cs = rng() < 0.5 ? 'home' : 'away';
        var cp = pickWeighted(side[cs].xi, CARD_W, rng);

        events.push({ minute: m, side: cs, attack: false, type: 'yellow', player: { id: cp.id, name: cp.name } });
      }
      if (rng() < 0.0009) {
        var rs = rng() < 0.5 ? 'home' : 'away';
        var rp = pickWeighted(side[rs].xi, CARD_W, rng);
        stats[rs].red++;
        reds[rs]++;
        events.push({ minute: m, side: rs, attack: false, type: 'red', player: { id: rp.id, name: rp.name } });
      }
    }

    /* เรียงตามเวลาที่ "เฉลย" ในแอนิเมชัน: ใบเหลืองกลางนาที ผลการยิงท้ายนาที */
    events.forEach(function (e) { e.reveal = e.minute - 1 + (e.attack ? 0.85 : 0.5); });
    events.sort(function (x, y) { return x.reveal - y.reveal; });

    return {
      seed: seed,
      total: total,
      events: events,
      possession: possession,
      score: score,
      stats: stats,
      possessionPct: {
        home: Math.round(100 * stats.home.possMin / total),
        away: Math.round(100 * stats.away.possMin / total)

      ratings: { home: side.home.r, away: side.away.r }

  }

  function makeSampleData(seed, nClubs) {

      Object.keys(counts).forEach(function (pos) {

          players.push({
            id: pid++, name: n[1] + ' ' + pos + (i + 1), first_name: '', second_name: '',
            club_id: ci + 1, position: pos, price: 5, status: 'a', news: '', minutes: 0,
            goals: 0, assists: 0, clean_sheets: 0, xg: 0, xa: 0,
            rating: Math.round(clamp(level + (rng() - 0.5) * 22, 40, 95))
          });

    return { players: players, clubs: clubs };
  }

  var api = {
    FORMATIONS: FORMATIONS, layout: layout, pickLineup: pickLineup, teamRatings: teamRatings,
    simulate: simulate, makeSampleData: makeSampleData, TUNE: TUNE, MENT_ATT: MENT_ATT, MENT_DEF: MENT_DEF

  function upgrade(s) {
    s.players.forEach(initPlayerState);
    if (!s.form) { s.form = {}; s.clubs.forEach(function (c) { s.form[c.id] = ''; }); }
    if (!s.news) s.news = [];
    if (!s.objective) s.objective = makeObjective(s.players, s.clubs, s.userClubId);
    if (s.confidence === undefined) s.confidence = 60;
    if (s.saved_at === undefined) s.saved_at = 0;
    if (!s.deals) s.deals = [];
    if (!s.history) s.history = [];
    if (!s.training) s.training = { focus: 'ALL', intensity: 'normal' };
    if (s.income === undefined) s.income = r2(wageBill(s, s.userClubId) + WEEKLY_INCOME);
    if (!s.manager) s.manager = 'ผู้จัดการ';
    if (!s.tactic) s.tactic = { mentality: 0 };
    if (!s.lineups) s.lineups = {};
    if (!s.results) s.results = {};
    if (!s.budgetLog) s.budgetLog = [];
    if (s.xfer === undefined) s.xfer = 0;
    if (s.newsSeq === undefined) {          /* ข่าวเก่าที่ยังไม่มีรหัส: ให้รหัสเรียงจากเก่าไปใหม่ และถือว่าอ่านแล้ว */
      var n = s.news.length;
      s.news.forEach(function (it, i) { it.id = n - i; });
      s.newsSeq = n; s.inboxRead = n;
    }
    if (s.inboxRead === undefined) s.inboxRead = 0;
    s.version = VERSION;
    return s;
  }

  /* ---------- นักเตะ/ทีม ---------- */
  function squadOf(state, clubId) {
    return state.players.filter(function (p) { return p.club_id === clubId; });
  }
  /* ค่าพลังที่ใช้จริงในแมตช์ (รวมฟอร์มชั่วคราวจากเหตุการณ์) */
  function effective(p) {
    return p.form ? Object.assign({}, p, { rating: clamp(p.rating + p.form, 30, 99) }) : p;
  }
  function effectivePlayers(state) { return state.players.map(effective); }
  function formationFor(state, clubId) {
    if (clubId === state.userClubId) return state.formation;
    var names = Object.keys(E.FORMATIONS);
    return names[Math.floor(hash01(clubId * 7 + state.round) * names.length)];
  }
  function lineup(state, clubId) {
    var f = formationFor(state, clubId);
    var forced = clubId === state.userClubId && state.lineups ? state.lineups[f] : null;
    return E.pickLineup(squadOf(state, clubId).map(effective), f, forced);
  }
  /* จัดตัวเอง: วางผู้เล่นลงช่องที่ slot ถ้าผู้เล่นอยู่ในช่องอื่นอยู่แล้วให้สลับกัน */
  function setLineup(state, slotIdx, playerId) {
    var f = state.formation, xi = lineup(state, state.userClubId);
    var ids = xi.map(function (s) { return s.player.id < 0 ? null : s.player.id; });
    var j = ids.indexOf(playerId);
    if (j >= 0) { ids[j] = ids[slotIdx]; ids[slotIdx] = playerId; } else ids[slotIdx] = playerId;
    state.lineups[f] = ids;
  }
  function autoLineup(state) { delete state.lineups[state.formation]; }
  function hasManualLineup(state) { return !!state.lineups[state.formation]; }
  function setMentality(state, m) { state.tactic.mentality = clamp(Math.round(m), -2, 2); }
  function outLabel(p) {
    if (!(p.out > 0)) return '';
    return (p.out_reason === 'ban' ? 'แบน ' : 'พัก ') + p.out + ' นัด';
  }
  function finished(state) { return state.round >= state.fixtures.length; }
  function userFixture(state) {
    if (finished(state)) return null;
    var fx = state.fixtures[state.round];
    for (var i = 0; i < fx.length; i++) {
      if (fx[i].h === state.userClubId || fx[i].a === state.userClubId) return fx[i];
    }
    return null;
  }

  function clubName(state, id) {
    for (var i = 0; i < state.clubs.length; i++) if (state.clubs[i].id === id) return state.clubs[i].name;
    return '?';
  }
  function addNews(state, kind, text, extra) {
    state.newsSeq = (state.newsSeq || 0) + 1;
    state.news.unshift(Object.assign({ id: state.newsSeq, round: state.round, kind: kind, text: text }, extra || {}));
    if (state.news.length > NEWS_MAX) state.news.length = NEWS_MAX;
  }

  /* ---------- สถิติ/ผลแมตช์ ---------- */
  function bump(state, id, key) {
    if (id < 0) return 0;
    var s = state.stats[id] || (state.stats[id] = { g: 0, a: 0, y: 0, r: 0 });
    if (s[key] === undefined) s[key] = 0;
    return ++s[key];
  }
  function pushForm(state, id, ch) {
    state.form[id] = ((state.form[id] || '') + ch).slice(-12);
  }
  function record(state, f, res, bans) {
    var hg = res.score.home, ag = res.score.away, H = state.table[f.h], A = state.table[f.a];
    H.p++; A.p++; H.gf += hg; H.ga += ag; A.gf += ag; A.ga += hg;
    if (hg > ag) { H.w++; A.l++; H.pts += 3; pushForm(state, f.h, 'W'); pushForm(state, f.a, 'L'); }
    else if (hg < ag) { A.w++; H.l++; A.pts += 3; pushForm(state, f.h, 'L'); pushForm(state, f.a, 'W'); }
    else { H.d++; A.d++; H.pts++; A.pts++; pushForm(state, f.h, 'D'); pushForm(state, f.a, 'D'); }
    res.events.forEach(function (e) {
      if (e.type === 'goal') { bump(state, e.player.id, 'g'); if (e.assist) bump(state, e.assist.id, 'a'); }
      else if (e.type === 'yellow') {
        if (bump(state, e.player.id, 'y') % YELLOWS_FOR_BAN === 0) bans.push({ id: e.player.id, games: 1, why: 'สะสมใบเหลือง' });
      } else if (e.type === 'red') {
        bump(state, e.player.id, 'r');
        bans.push({ id: e.player.id, games: 1 + Math.floor(hash01(e.player.id + state.round) * 3), why: 'ใบแดง' });
      }
    });
  }

  function injuryLength(rng) {
    var r = rng();
    if (r < 0.5) return 1 + Math.floor(rng() * 2);
    if (r < 0.85) return 3 + Math.floor(rng() * 4);
    return 7 + Math.floor(rng() * 8);
  }

  function isMine(state, p) { return p.club_id === state.userClubId; }

  /* ---------- เหตุการณ์สุ่มของทีมเรา ---------- */
  function rollEvent(state, rng) {
    if (rng() >= EVENT_CHANCE) return;
    var mine = squadOf(state, state.userClubId);
    var outfield = mine.filter(function (p) { return p.position !== 'GK' && !(p.out > 0); });
    var types = ['sponsor', 'sponsor', 'sponsor', 'hot', 'hot', 'hot', 'sulk', 'sulk'];
    if (mine.length < SQUAD_MAX) types.push('youth');
    if (state.budget >= 10) types.push('repair');
    var type = pick(rng, types), p;

    if (type === 'sponsor') {
      var amt = r1(5 + rng() * 7);
      state.budget = r1(state.budget + amt);
      addNews(state, 'event', 'สปอนเซอร์รายใหม่เซ็นสัญญากับสโมสร ได้งบเพิ่ม £' + amt + 'm', { club: state.userClubId });
    } else if (type === 'repair') {
      var cost = r1(3 + rng() * 3);
      state.budget = r1(state.budget - cost);
      addNews(state, 'event', 'ต้องซ่อมสนามฉุกเฉิน เสียค่าใช้จ่าย £' + cost + 'm', { club: state.userClubId });
    } else if (type === 'hot' && outfield.length) {
      p = pick(rng, outfield);
      p.form = 3; p.form_rounds = 3;
      addNews(state, 'event', '' + p.name + ' ฟอร์มร้อนแรงในการซ้อม ค่าพลัง +3 นาน 3 นัด', { club: state.userClubId });
    } else if (type === 'sulk' && outfield.length) {
      p = pick(rng, outfield);
      p.form = -3; p.form_rounds = 3;
      addNews(state, 'event', '' + p.name + ' ไม่พอใจเรื่องเวลาลงเล่น ค่าพลัง -3 นาน 3 นัด', { club: state.userClubId });
    } else if (type === 'youth') {
      var maxId = 0;
      state.players.forEach(function (q) { if (q.id > maxId) maxId = q.id; });
      var pos = pick(rng, ['GK', 'DEF', 'DEF', 'MID', 'MID', 'FWD']);
      var club = state.clubs.filter(function (c) { return c.id === state.userClubId; })[0];
      var yp = {
        id: maxId + 1, name: 'ดาวรุ่ง ' + club.short_name + ' ' + (maxId + 1), first_name: '', second_name: '',
        club_id: state.userClubId, position: pos, price: 4, status: 'a', news: '', minutes: 0, goals: 0, assists: 0,
        clean_sheets: 0, xg: 0, xa: 0, rating: 50 + Math.floor(rng() * 13), out: 0, form: 0, form_rounds: 0,
        age: 17 + Math.floor(rng() * 3)
      };
      initPlayerState(yp); yp.contract = 3;
      state.players.push(yp);
      addNews(state, 'event', 'ดาวรุ่งจากอะคาเดมีขึ้นสู่ทีมชุดใหญ่: ' + yp.name + ' (' + pos + ' ค่าพลัง ' + yp.rating + ')', { club: state.userClubId });
    }
  }

  /* ข่าวจากสถิติจริงในลีก: ชนะ/ไม่แพ้/แพ้ติดต่อกัน และจ่าฝูง */
  function streakNews(state) {
    var count = 0;
    state.clubs.forEach(function (c) {
      var f = state.form[c.id] || '', n;
      function run(re) { var m = f.match(re); return m ? m[0].length : 0; }
      n = run(/W+$/); if (n === 4 || n === 6 || n === 8) { addNews(state, 'league', '' + c.name + ' ชนะติดต่อกัน ' + n + ' นัด', { club: c.id }); count++; }
      n = run(/[WD]+$/); if (n === 8 || n === 12) { addNews(state, 'league', '' + c.name + ' ไม่แพ้ ' + n + ' นัดติด', { club: c.id }); count++; }
      n = run(/L+$/); if (n === 4) { addNews(state, 'league', '' + c.name + ' แพ้ติดต่อกัน ' + n + ' นัด', { club: c.id }); count++; }
    });
    if (state.round % 5 === 0 && state.round > 0) {
      var top = standings(state)[0];
      addNews(state, 'league', 'ผ่านไป ' + state.round + ' นัด ' + top.club.name + ' นำจ่าฝูง ' + top.pts + ' แต้ม', { club: top.club.id });
    }
    return count;
  }

  function updateBoard(state) {
    if (state.round < 3) return;
    var st = standings(state), pos = 0;
    st.forEach(function (r, i) { if (r.club.id === state.userClubId) pos = i + 1; });
    var delta = clamp((state.objective.target - pos) * 0.5, -4, 3);
    state.confidence = clamp(Math.round((state.confidence + delta) * 10) / 10, 0, 100);
  }

  /* จบนัดปัจจุบัน: ใช้ผลของทีมเราที่เล่นมาแล้ว (ถ้ามี) ที่เหลือจำลองให้ทั้งหมด
   * แล้วจัดการบาดเจ็บ/แบน ฟอร์ม เหตุการณ์สุ่ม ข่าว และบอร์ด */
  function applyRound(state, userMatch) {
    if (finished(state)) return [];
    var round = state.round, fx = state.fixtures[round], out = [], bans = [], lineups = [];
    var rng = mulberry32((state.seed + round * 7919 + 13) | 0);

    fx.forEach(function (f, idx) {
      var xiH = lineup(state, f.h), xiA = lineup(state, f.a), res;
      if (userMatch && userMatch.h === f.h && userMatch.a === f.a) res = userMatch.result;
      else res = E.simulate(xiH, xiA, { seed: state.seed + round * 100 + idx });
      record(state, f, res, bans);
      out.push({ h: f.h, a: f.a, hg: res.score.home, ag: res.score.away });
      lineups = lineups.concat(xiH, xiA);
    });

    /* 1) ผู้ที่พักครบแล้วกลับมา และฟอร์มชั่วคราวหมดอายุ */
    state.players.forEach(function (p) {
      if (p.out > 0) {
        p.out--;
        if (p.out <= 0) {
          p.out = 0; p.status = 'a'; p.news = '';
          if (isMine(state, p)) addNews(state, 'injury', '' + p.name + ' ' + (p.out_reason === 'ban' ? 'พ้นโทษแบน' : 'หายเจ็บ') + ' พร้อมลงเล่น', { club: state.userClubId });
        }
      }
      if (p.form_rounds > 0) { p.form_rounds--; if (p.form_rounds <= 0) { p.form = 0; p.form_rounds = 0; } }
    });

    /* 2) บาดเจ็บใหม่จากนัดนี้ (เฉพาะตัวจริง) */
    var injMult = INTENSITY[(state.training || {}).intensity || 'normal'].inj;
    lineups.forEach(function (slot) {
      var p = slot.player;
      if (p.id < 0 || rng() >= INJURY_RATE * proneMult(p) * (p.club_id === state.userClubId ? injMult : 1)) return;
      var real = state.players.filter(function (q) { return q.id === p.id; })[0];
      if (!real || real.out > 0) return;
      var len = injuryLength(rng);
      real.status = 'i'; real.out = len; real.out_reason = 'injury'; real.news = 'บาดเจ็บ';
      if (isMine(state, real)) addNews(state, 'injury', '' + real.name + ' บาดเจ็บ ต้องพักประมาณ ' + len + ' นัด', { club: state.userClubId });
      else if (real.rating >= 80) addNews(state, 'league', '' + real.name + ' (' + clubName(state, real.club_id) + ') บาดเจ็บ พักประมาณ ' + len + ' นัด', { club: real.club_id });
    });

    /* 3) แบนจากใบแดง/สะสมใบเหลือง */
    bans.forEach(function (b) {
      var real = state.players.filter(function (q) { return q.id === b.id; })[0];
      if (!real || real.out >= b.games) return;
      real.status = 's'; real.out = b.games; real.out_reason = 'ban'; real.news = 'โดนแบน';
      if (isMine(state, real)) addNews(state, 'injury', '' + real.name + ' โดนแบน ' + b.games + ' นัด (' + b.why + ')', { club: state.userClubId });
    });

    trainRound(state);

    state.results[round] = out;
    state.round++;
    /* รายรับ - ค่าเหนื่อทั้งทีม */
    var wages = wageBill(state, state.userClubId), base = r1(state.budget + state.income - wages);
    state.budget = base;
    state.lastResults = out;
    rollEvent(state, rng);
    state.budgetLog.push({ round: state.round, income: state.income, wages: wages, transfers: r1(state.xfer || 0), events: r1(state.budget - base), balance: state.budget });
    if (state.budgetLog.length > 40) state.budgetLog.shift();
    state.xfer = 0;
    streakNews(state);
    contractNews(state);
    if (windowOpen(state)) aiTransfers(state, rng, AI_DEALS_PER_ROUND);
    updateBoard(state);
    if (state.budget < 0) state.confidence = clamp(Math.round((state.confidence - 1) * 10) / 10, 0, 100);
    return out;
  }

  /* ---------- เทรนนิ่ง: ทุกทีมได้ xp ตามแผน (ทีมคอมพิวเตอร์ใช้แผนปกติ) ---------- */
  function setTraining(state, focus, intensity) {
    if (focus) state.training.focus = focus;
    if (intensity && INTENSITY[intensity]) state.training.intensity = intensity;
  }
  function trainRound(state) {
    var tr = state.training || { focus: 'ALL', intensity: 'normal' };
    state.players.forEach(function (p) {
      if (p.out > 0 || p.rating >= 99) return;
      var mine = isMine(state, p);
      var rate = INTENSITY[mine ? tr.intensity : 'normal'].xp;
      if (mine && tr.focus !== 'ALL') rate *= (p.position === tr.focus ? 1.6 : 0.7);
      p.xp = (p.xp || 0) + rate;
      var cap = potential(state, p);
      for (;;) {
        var need = XP_BASE + Math.max(0, p.rating - 75) * 0.8;
        if (p.xp < need) break;
        if ((p.grown || 0) >= cap) { p.xp = need - 0.01; break; }
        p.xp -= need; p.rating++; p.grown = (p.grown || 0) + 1;
        if (p.ca != null) p.ca = r1(p.ca + 2.2);
        if (mine) addNews(state, 'training', '' + p.name + ' พัฒนาจากการฝึกซ้อม ค่าพลัง ' + (p.rating - 1) + ' → ' + p.rating, { club: state.userClubId });
      }
    });
  }

  /* ---------- สัญญา ---------- */
  function contractNews(state) {
    var left = state.fixtures.length - state.round;
    if (left !== 4 && left !== 1) return;
    var list = squadOf(state, state.userClubId).filter(function (p) { return p.contract <= 1; })
      .sort(function (a, b) { return b.rating - a.rating; });
    if (!list.length) return;
    addNews(state, 'contract', 'สัญญาใกล้หมดท้ายฤดูกาล: ' + list.slice(0, 4).map(function (p) { return p.name; }).join(', ') +
      (list.length > 4 ? ' และอีก ' + (list.length - 4) + ' คน' : '') + ' ถ้าไม่ต่อสัญญาจะออกจากทีมฟรี', { club: state.userClubId });
  }

  /* ต่อสัญญา: ต่อได้เมื่อสัญญาเหลือไม่เกิน 2 ปี นักเตะที่กำลังไม่พอใจจะปฏิเสธ
   * ค่าเหนื่อใหม่แพงขึ้นตามจำนวนปี และต้องจ่ายค่าเซ็นสัญญา (ค่าเหนื่อ 6 นัด) */
  function renewOffer(p, years) {
    var w = r2(Math.max(p.wage || 0, baseWage(p)) * (1.1 + 0.05 * years) * (p.rating >= 80 ? 1.15 : 1));
    return { wage: w, bonus: r1(w * 6) };
  }
  function renew(state, id, years) {
    var p = findPlayer(state, id);
    if (!p || p.club_id !== state.userClubId) return fail('นักเตะคนนี้ไม่ได้อยู่ในทีมคุณ');
    if (p.contract > 2) return fail(p.name + ' ยังมีสัญญาอีก ' + p.contract + ' ปี ยังไม่ต้องต่อ (ต่อได้เมื่อเหลือไม่เกิน 2 ปี)');
    if (p.form < 0) return fail(p.name + ' กำลังไม่พอใจ ปฏิเสธการเจรจาต่อสัญญาในตอนนี้');
    var offer = renewOffer(p, years);
    if (state.budget < offer.bonus) return fail('งบไม่พอจ่ายค่าเซ็นสัญญา £' + offer.bonus + 'm');
    state.budget = r1(state.budget - offer.bonus); state.xfer = r1((state.xfer || 0) - offer.bonus);
    p.contract = Math.min(5, p.contract + years); p.wage = offer.wage;
    addNews(state, 'contract', 'ต่อสัญญา ' + p.name + ' อีก ' + years + ' ปี (รวมเหลือ ' + p.contract + ' ปี) ค่าเหนื่อ £' + offer.wage + 'm/นัด', { club: state.userClubId });
    return { ok: true, msg: 'ต่อสัญญา ' + p.name + ' สำเร็จ เหลือ ' + p.contract + ' ปี ค่าเหนื่อ £' + offer.wage + 'm/นัด (ค่าเซ็น £' + offer.bonus + 'm)' };
  }

  /* ---------- ทีมคอมพิวเตอร์ซื้อขายกันเอง ---------- */
  function clubRanks(state) {
    var ranked = state.clubs.map(function (c) { return { id: c.id, s: clubStrength(state.players, c.id) }; })
      .sort(function (a, b) { return b.s - a.s || (a.id < b.id ? -1 : 1); });
    var map = {};
    ranked.forEach(function (c, i) { map[c.id] = i; });
    return map;
  }
  function starterLevel(list, pos) {
    var r = list.filter(function (p) { return p.position === pos; }).map(function (p) { return p.rating; })
      .sort(function (a, b) { return b - a; }).slice(0, STARTERS[pos]);
    while (r.length < STARTERS[pos]) r.push(40);
    return r.reduce(function (x, y) { return x + y; }, 0) / r.length;
  }
  /* ทีมที่อ่อนตำแหน่งไหนก็ซื้อตัวเก่งกว่าตำแหน่งนั้น ภายในงบตามฐานะทีม
   * ทีมใหญ่ไม่ขายดาวเด่น 3 อันดับแรกให้ทีมที่เล็กกว่า และไม่แตะนักเตะของทีมผู้เล่น */
  function aiTransfers(state, rng, count) {
    var n = state.clubs.length, ranks = clubRanks(state), done = 0, tries = 0;
    while (done < count && tries < count * 15) {
      tries++;
      var buyers = state.clubs.filter(function (c) { return c.id !== state.userClubId && squadOf(state, c.id).length < AI_SQUAD_MAX; });
      if (!buyers.length) break;
      var b = pick(rng, buyers), bs = squadOf(state, b.id), need = null;
      ['GK', 'DEF', 'MID', 'FWD'].forEach(function (pos) {
        var lv = starterLevel(bs, pos) + rng() * 8;
        if (!need || lv < need.lv) need = { pos: pos, lv: lv, base: starterLevel(bs, pos) };
      });
      var maxFee = 6 + 50 * (1 - ranks[b.id] / Math.max(1, n - 1));
      var cands = state.players.filter(function (p) {
        return p.position === need.pos && p.club_id !== b.id && p.club_id !== state.userClubId &&
          p.rating >= need.base + 2 && value(p) * contractFactor(p) <= maxFee;

      if (!cands.length) continue;
      var p = pick(rng, cands), from = p.club_id, sq = squadOf(state, from);
      if (!canLose(sq, p)) continue;

      if (top3.indexOf(p.id) >= 0 && ranks[from] < ranks[b.id]) continue;

  /* ---------- จบฤดูกาล → ฤดูกาลถัดไป ---------- */

    var prize = r1((state.clubs.length - pos) * 1.5);
    state.history.push({ season: state.season, champion: st[0].club.name, pos: pos, target: state.objective.target });
    state.budget = r1(state.budget + prize);

    state.players.forEach(function (p) {

    /* สัญญาของผู้เล่นทีมเราหมด: ออกไปอยู่ทีมอื่นแบบไร้ค่าตัว */
    gone.forEach(function (p) {
      var buyers = state.clubs.filter(function (c) { return c.id !== state.userClubId && squadOf(state, c.id).length < AI_SQUAD_MAX; });
      if (!buyers.length) return;

    state.season = nextSeasonLabel(state.season);
    state.seed = (state.seed + 1013) | 0;
    state.round = 0;
    state.fixtures = makeFixtures(state.clubs.map(function (c) { return c.id; }), state.seed);
    state.clubs.forEach(function (c) { state.table[c.id] = { p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }; state.form[c.id] = ''; });
    state.stats = {}; state.transfers = []; state.lastResults = []; state.lastReport = null; state.digest = null;
    state.results = {}; state.budgetLog = []; state.xfer = 0;
    state.confidence = clamp(state.confidence + (met ? 10 : -10), 0, 100);

    addNews(state, 'league', 'เริ่มฤดูกาล ' + state.season + ' · จบฤดูกาลก่อนอันดับ ' + pos + ' ได้เงินรางวัล £' + prize + 'm', { club: state.userClubId });
    if (gone.length) {
      addNews(state, 'contract', 'สัญญาหมด ออกจากทีมแบบไร้ค่าตัว: ' + gone.slice().sort(function (a, b) { return b.rating - a.rating; })
        .slice(0, 5).map(function (p) { return p.name; }).join(', ') + (gone.length > 5 ? ' และอีก ' + (gone.length - 5) + ' คน' : ''), { club: state.userClubId });
    }
    aiTransfers(state, rng, AI_DEALS_PRESEASON + 2);
    state.objective = makeObjective(state.players, state.clubs, state.userClubId);
    var mine = squadOf(state, state.userClubId).length;
    if (mine < SQUAD_MIN) addNews(state, 'event', 'ทีมเหลือนักเตะ ' + mine + ' คน ต้องซื้อเพิ่มอย่างน้อย ' + SQUAD_MIN + ' คนในตลาดก่อนเปิดฤดูกาล', { club: state.userClubId });

  }

  /* ---------- ตลาดซื้อขาย ---------- */
  function windowRange(state) {
    var mid = Math.floor(state.fixtures.length / 2);

  function windowOpen(state) {
    var w = windowRange(state);

  }
  function posCount(list, pos) {
    return list.filter(function (p) { return p.position === pos; }).length;
  }
  function canLose(list, p) {

  }

    for (var i = 0; i < state.players.length; i++) if (state.players[i].id === id) return state.players[i];

  }
  function fail(msg) { return { ok: false, msg: msg }; }

  function buy(state, id) {

    var p = findPlayer(state, id);
    if (!p) return fail('ไม่พบนักเตะ');
    if (p.club_id === state.userClubId) return fail('นักเตะคนนี้อยู่ในทีมคุณแล้ว');
    if (squadOf(state, state.userClubId).length >= SQUAD_MAX) return fail('ทีมเต็ม (สูงสุด ' + SQUAD_MAX + ' คน)');
    var ask = askPrice(p);
    if (state.budget < ask) return fail('งบไม่พอ ต้องใช้ £' + ask + 'm');
    if (!canLose(squadOf(state, p.club_id), p)) return fail('สโมสรเจ้าของปฏิเสธ: ขายแล้วจะเหลือนักเตะไม่พอ');
    var from = p.club_id;
    p.club_id = state.userClubId;
    p.contract = 3; p.wage = baseWage(p);
    state.budget = r1(state.budget - ask); state.xfer = r1((state.xfer || 0) - ask);
    state.transfers.push({ round: state.round, type: 'buy', id: p.id, name: p.name, other: from, fee: ask });
    addNews(state, 'transfer', 'ซื้อ ' + p.name + ' จาก ' + clubName(state, from) + ' ราคา £' + ask + 'm', { club: state.userClubId });
    return { ok: true, msg: 'ซื้อ ' + p.name + ' สำเร็จ £' + ask + 'm', fee: ask };
  }

  function sell(state, id) {
    if (!windowOpen(state)) return fail('ตลาดปิดอยู่');
    var p = findPlayer(state, id);
    if (!p || p.club_id !== state.userClubId) return fail('นักเตะคนนี้ไม่ได้อยู่ในทีมคุณ');
    if (!canLose(squadOf(state, state.userClubId), p)) {
      return fail('ขายไม่ได้: ทีมต้องมีอย่างน้อย ' + SQUAD_MIN + ' คน และแต่ละตำแหน่งต้องไม่ต่ำกว่าขั้นต่ำ');
    }
    var buyers = state.clubs.filter(function (c) {
      return c.id !== state.userClubId && squadOf(state, c.id).length < AI_SQUAD_MAX;
    });
    if (!buyers.length) return fail('ไม่มีสโมสรสนใจ');
    buyers.sort(function (a, b) {
      return posCount(squadOf(state, a.id), p.position) - posCount(squadOf(state, b.id), p.position) || a.id - b.id;
    });

    p.club_id = buyer.id; p.contract = 3; p.wage = baseWage(p);

    state.transfers.push({ round: state.round, type: 'sell', id: p.id, name: p.name, other: buyer.id, fee: bid });
    addNews(state, 'transfer', 'ขาย ' + p.name + ' ให้ ' + buyer.name + ' ราคา £' + bid + 'm', { club: state.userClubId });

    return pos;
  }

  var api = {
    POS_MIN: POS_MIN, SQUAD_MIN: SQUAD_MIN, SQUAD_MAX: SQUAD_MAX, INTENSITY: INTENSITY,

<script>
/* ข่าวและบทบรรยาย: เทมเพลตภาษาไทย (ใช้ได้ออฟไลน์เสมอ) + ตัวเลือกให้ Claude เขียนใหม่
 * หลักการ: เนื้อหาทุกอย่างมาจากข้อมูลในเกม AI เขียนได้เฉพาะจากข้อมูลที่ส่งให้ และมีตัวตรวจก่อนนำไปแสดง */
(function (root) {
  'use strict';

  var AI_KEY = 'fm_ai_v1';
  var DEFAULT_MODEL = 'claude-haiku-5-5';

  function hash01(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function pickT(list, seed) { return list[Math.floor(hash01(seed) * list.length)]; }

  /* ---------- บทบรรยายรายเหตุการณ์ ---------- */
  /* ctx = { team, opp, sf, sa } : sf/sa คือสกอร์หลังเกิดประตู (ของทีมที่ยิง/ทีมที่เสีย) */
  function eventLine(e, ctx) {
    var m = e.minute, p = e.player.name, seed = m * 31 + (e.player.id || 0) * 7, t;
    switch (e.type) {
      case 'goal':
        var a = e.assist ? ' จ่ายให้โดย ' + e.assist.name : '';
        var state = '';
        if (ctx.sf === ctx.sa) state = ' ตีเสมอเป็น ' + ctx.sf + '-' + ctx.sa;
        else if (ctx.sf === 1 && ctx.sa === 0) state = ' ขึ้นนำ 1-0';
        else if (ctx.sf > ctx.sa) state = ' ทีมนำ ' + ctx.sf + '-' + ctx.sa;
        else state = ' ไล่ตามมาเป็น ' + ctx.sf + '-' + ctx.sa;
        t = pickT([
          '' + m + "' ประตู! " + p + ' (' + ctx.team + ')' + a + state,
          '' + m + "' " + p + ' ทำประตูให้ ' + ctx.team + a + state,
          '' + m + "' เข้าไปแล้ว! " + p + ' ยิงให้ ' + ctx.team + state + a
        ], seed);
        return [t, 'goal'];
      case 'save':
        return [pickT([
          '' + m + "' " + e.gk.name + ' (' + ctx.opp + ') เซฟลูกยิงของ ' + p + ' ไว้ได้',
          '' + m + "' " + p + ' (' + ctx.team + ') ยิงตรงกรอบ แต่ ' + e.gk.name + ' ปัดออก'
        ], seed), ''];
      case 'miss':
        return [pickT([
          '' + m + "' " + p + ' (' + ctx.team + ') ยิงไม่เข้ากรอบ',
          '' + m + "' โอกาสของ " + ctx.team + ' ' + p + ' ยิงไม่ตรงกรอบ'
        ], seed), ''];
      case 'yellow':
        return ['' + m + "' " + p + ' (' + ctx.team + ') โดนใบเหลือง', ''];
      case 'red':
        return ['' + m + "' " + p + ' (' + ctx.team + ') โดนใบแดง! เหลือผู้เล่น 10 คน', 'goal'];
    }

  }

  /* ---------- รายงานแมตช์ ---------- */
  function goalsOf(res) {
    return res.events.filter(function (e) { return e.type === 'goal'; });
  }
  function cardsOf(res, type) {
    return res.events.filter(function (e) { return e.type === type; });
  }

  /* ข้อมูลล้วน ส่งให้ AI หรือใช้เขียนเทมเพลต: ตัวเลขทุกตัวในรายงานต้องมาจากที่นี่ */
  function matchFacts(ctx) {
    var res = ctx.res, g = goalsOf(res);
    return {
      round: ctx.round,
      home: ctx.home, away: ctx.away,
      score: { home: res.score.home, away: res.score.away },
      totalGoals: res.score.home + res.score.away,
      goals: g.map(function (e) {
        return { minute: e.minute, team: e.side === 'home' ? ctx.home : ctx.away, scorer: e.player.name, assist: e.assist ? e.assist.name : null };
      }),
      shots: { home: res.stats.home.shots, away: res.stats.away.shots },
      onTarget: { home: res.stats.home.onTarget, away: res.stats.away.onTarget },
      possessionPercent: { home: res.possessionPct.home, away: res.possessionPct.away },
      yellowCards: { home: res.stats.home.yellow, away: res.stats.away.yellow },
      redCards: cardsOf(res, 'red').map(function (e) { return { minute: e.minute, team: e.side === 'home' ? ctx.home : ctx.away, player: e.player.name }; }),
      managedTeam: ctx.userSide ? (ctx.userSide === 'home' ? ctx.home : ctx.away) : null

  }

  function matchReport(ctx) {
    var f = matchFacts(ctx), hs = f.score.home, as = f.score.away;
    var parts = [], seed = (ctx.round || 1) * 13 + hs * 5 + as;
    var user = f.managedTeam, uHome = ctx.userSide === 'home';
    var line1;
    if (user) {
      var mine = uHome ? hs : as, theirs = uHome ? as : hs, opp = uHome ? ctx.away : ctx.home;
      if (mine > theirs) line1 = pickT([user + ' เอาชนะ ' + opp + ' ' + mine + '-' + theirs, user + ' ทำได้ดี ชนะ ' + opp + ' ' + mine + '-' + theirs], seed);
      else if (mine < theirs) line1 = pickT([user + ' พ่ายให้ ' + opp + ' ' + mine + '-' + theirs, user + ' แพ้ ' + opp + ' ' + mine + '-' + theirs], seed);
      else line1 = user + ' เสมอกับ ' + opp + ' ' + mine + '-' + theirs;
    } else {
      line1 = f.home + ' ' + hs + '-' + as + ' ' + f.away;
    }
    parts.push(line1 + ' ในนัดที่ ' + f.round + ' ของลีก');

    if (!f.goals.length) {
      parts.push('เกมนี้ไม่มีประตูเกิดขึ้น');
    } else {
      parts.push('ประตูของเกม: ' + f.goals.map(function (g) {
        return g.scorer + " (" + g.team + ' ' + g.minute + "'" + (g.assist ? ' จ่ายโดย ' + g.assist : '') + ')';
      }).join(', '));
    }

    parts.push('ยิงทั้งหมด ' + f.shots.home + '-' + f.shots.away + ' (ตรงกรอบ ' + f.onTarget.home + '-' + f.onTarget.away +
      ') ครองบอล ' + f.possessionPercent.home + '%-' + f.possessionPercent.away + '%');

    var winnerShots = hs > as ? f.shots.home - f.shots.away : as > hs ? f.shots.away - f.shots.home : null;
    if (winnerShots !== null && winnerShots < 0) parts.push('ทีมที่ชนะยิงน้อยกว่าแต่ใช้โอกาสได้คุ้มกว่า');

    var yc = f.yellowCards.home + f.yellowCards.away;
    if (yc) parts.push('ใบเหลือง ' + yc + ' ใบ (' + f.yellowCards.home + '-' + f.yellowCards.away + ')');
    f.redCards.forEach(function (r) { parts.push('ใบแดง: ' + r.player + ' (' + r.team + ' ' + r.minute + "')"); });
    return parts.join('\n');
  }

  /* ---------- สรุปสัปดาห์ (ทั้งลีก) ---------- */
  function roundupFacts(state, S) {
    var names = {}; state.clubs.forEach(function (c) { names[c.id] = c.name; });
    var st = S.standings(state);
    return {
      round: state.round,
      results: (state.lastResults || []).map(function (r) { return { home: names[r.h], away: names[r.a], homeGoals: r.hg, awayGoals: r.ag }; }),
      tableTop3: st.slice(0, 3).map(function (r) { return { club: r.club.name, points: r.pts, played: r.p }; }),
      tableBottom: st.slice(-1).map(function (r) { return { club: r.club.name, points: r.pts, played: r.p }; }),
      managedClub: { name: names[state.userClubId], position: S.userPosition(state), points: state.table[state.userClubId].pts },
      topScorers: S.topScorers(state, 3).map(function (x) { return { player: x.player.name, goals: x.g }; })
    };
  }

  function roundup(state, S) {
    var f = roundupFacts(state, S), parts = [];
    parts.push('สรุปหลังนัดที่ ' + f.round);
    if (f.results.length) {
      var big = f.results.slice().sort(function (a, b) {
        return Math.abs(b.homeGoals - b.awayGoals) - Math.abs(a.homeGoals - a.awayGoals) || (b.homeGoals + b.awayGoals) - (a.homeGoals + a.awayGoals);
      })[0];
      parts.push('ผลที่เด่นที่สุด: ' + big.home + ' ' + big.homeGoals + '-' + big.awayGoals + ' ' + big.away);
    }
    parts.push('จ่าฝูง: ' + f.tableTop3[0].club + ' ' + f.tableTop3[0].points + ' แต้ม ตามด้วย ' + f.tableTop3.slice(1).map(function (r) { return r.club + ' ' + r.points; }).join(', '));
    parts.push(f.managedClub.name + ' อยู่อันดับ ' + f.managedClub.position + ' มี ' + f.managedClub.points + ' แต้ม');
    if (f.topScorers.length) parts.push('ดาวซัลโว: ' + f.topScorers.map(function (x) { return x.player + ' ' + x.goals + ' ประตู'; }).join(', '));
    return parts.join('\n');
  }

  /* ---------- AI (ตัวเลือก: ใช้คีย์ของผู้เล่นเอง เก็บในเครื่องนี้เท่านั้น) ---------- */
  function aiSettings() {
    try { return JSON.parse(localStorage.getItem(AI_KEY) || 'null') || {}; } catch (e) { return {}; }
  }
  function saveAiSettings(s) {
    try { localStorage.setItem(AI_KEY, JSON.stringify(s)); return true; } catch (e) { return false; }
  }
  function hasAI() { return !!aiSettings().key; }

  var SYSTEM = 'คุณเป็นนักข่าวกีฬาในเกมจำลองการจัดการทีมฟุตบอลที่ผู้เล่นเล่นเอง ' +
    'เขียนเป็นภาษาไทย กระชับ 3-5 ประโยค ใช้ข้อมูลใน JSON ที่ให้มาเท่านั้น ' +
    'ห้ามเพิ่มตัวเลข ชื่อ เหตุการณ์ หรือสถิติที่ไม่มีในข้อมูล ห้ามใส่คำพูดที่อ้างว่าเป็นของบุคคลจริง ' +
    'ห้ามพูดถึงเรื่องส่วนตัวหรือข่าวลือของนักเตะหรือผู้จัดการ ใช้ชื่อสโมสรและนักเตะตรงตามที่ให้ไว้ในตัวอักษรเดิม ' +
    'ตอบเป็นข้อความธรรมดา ไม่ใช้ markdown ไม่ใช้หัวข้อ';

  var KIND_HINT = {
    report: 'เขียนรายงานแมตช์ของนัดนี้ ถ้ามี managedTeam ให้เล่าจากมุมของทีมนั้น',
    roundup: 'เขียนสรุปข่าวประจำสัปดาห์ของลีกจากข้อมูลนี้'
  };

  /* ตรวจข้อความ AI ให้เข้มกว่าการดูว่า "มีตัวเลขนี้ในข้อมูล":
   * 1) คำภาษาอังกฤษ/ชื่อทุกคำต้องมีอยู่ในข้อมูล
   * 2) ตัวเลขเดี่ยวต้องตรงกับค่าตัวเลขจริงในข้อมูล
   * 3) รูปแบบ "a-b" (สกอร์ สถิติ ครองบอล) ต้องเป็นคู่ที่มีอยู่จริงในข้อมูล (เหย้า-เยือน หรือสลับด้าน) */
  function collect(facts) {
    var nums = {}, words = {}, pairs = {}, strs = {};
    function addPair(a, b) { pairs[a + '-' + b] = true; pairs[b + '-' + a] = true; }
    function walk(v) {
      if (typeof v === 'number') nums[String(v)] = true;
      else if (typeof v === 'string') {
        strs[v] = true;
        (v.match(/[A-Za-z][A-Za-z0-9'.\-]*/g) || []).forEach(function (w) { words[w.toLowerCase()] = true; });
      }
      else if (Array.isArray(v)) v.forEach(walk);
      else if (v && typeof v === 'object') {
        if (typeof v.home === 'number' && typeof v.away === 'number') addPair(v.home, v.away);
        if (typeof v.homeGoals === 'number' && typeof v.awayGoals === 'number') addPair(v.homeGoals, v.awayGoals);
        Object.keys(v).forEach(function (k) { walk(v[k]); });
      }
    }
    walk(facts);
    return { nums: nums, words: words, pairs: pairs, strs: Object.keys(strs).sort(function (a, b) { return b.length - a.length; }) };
  }

  var LATIN = /[A-Za-z][A-Za-z0-9'.\-]*/g;
  function guard(text, facts) {
    var c = collect(facts);
    /* ตัดชื่อเต็มที่มีอยู่ในข้อมูลออกก่อน (เช่น "Sample Team 18") แล้วค่อยตรวจส่วนที่เหลือ */
    var cleaned = text;
    c.strs.forEach(function (name) { if (name) cleaned = cleaned.split(name).join(' '); });
    var badWord = (cleaned.match(LATIN) || []).filter(function (w) { return !c.words[w.toLowerCase()]; });
    var rest = cleaned.replace(LATIN, ' ');
    var badNum = (rest.match(/\d+/g) || []).filter(function (n) { return !c.nums[n]; });
    var badPair = [], m, re = /(\d+)%?\s*[-\u2013]\s*(\d+)%?/g;
    while ((m = re.exec(rest))) { if (!c.pairs[m[1] + '-' + m[2]]) badPair.push(m[0]); }
    return { ok: !badNum.length && !badWord.length && !badPair.length, badNum: badNum, badWord: badWord, badPair: badPair };
  }

  /* คืนข้อความจาก AI ถ้าผ่านตัวตรวจ ไม่ผ่านจะโยน error ให้ผู้เรียกใช้ข้อความเทมเพลตแทน */
  function aiWrite(kind, facts, fetchImpl) {
    var s = aiSettings();
    if (!s.key) return Promise.reject(new Error('ยังไม่ได้ตั้งค่าคีย์ AI'));
    var f = fetchImpl || root.fetch.bind(root);
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 25000) : null;
    return f('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      signal: ctl ? ctl.signal : undefined,
      headers: {
        'content-type': 'application/json',
        'x-api-key': s.key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: s.model || DEFAULT_MODEL,
        max_tokens: 500,
        system: SYSTEM,
        messages: [{ role: 'user', content: KIND_HINT[kind] + '\n\nข้อมูล (JSON):\n' + JSON.stringify(facts) }]
      })
    }).then(function (res) {
      if (timer) clearTimeout(timer);
      if (res.status === 401) throw new Error('คีย์ AI ไม่ถูกต้อง');
      if (!res.ok) throw new Error('เรียก AI ไม่สำเร็จ (' + res.status + ')');
      return res.json();
    }).then(function (j) {
      var text = (j.content || []).filter(function (b) { return b.type === 'text'; })
        .map(function (b) { return b.text; }).join('\n').trim();
      if (!text) throw new Error('AI ไม่ได้ตอบข้อความ');
      var g = guard(text, facts);
      if (!g.ok) throw new Error('AI เขียนข้อมูลที่ไม่อยู่ในเกม จึงไม่นำมาใช้');
      return text;
    }).catch(function (e) {
      if (timer) clearTimeout(timer);
      throw e.name === 'AbortError' ? new Error('AI ตอบช้าเกินไป') : e;
    });
  }

  var api = {
    eventLine: eventLine, matchFacts: matchFacts, matchReport: matchReport,
    roundupFacts: roundupFacts, roundup: roundup, guard: guard, aiWrite: aiWrite,
    aiSettings: aiSettings, saveAiSettings: saveAiSettings, hasAI: hasAI, DEFAULT_MODEL: DEFAULT_MODEL
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.FMNarrative = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ซิงก์เซฟข้ามเครื่องผ่าน GitHub Gist ส่วนตัว (ไม่ต้องมีเซิร์ฟเวอร์ของตัวเอง)
 * ใช้โทเค็น GitHub ของผู้เล่นเอง เก็บในเครื่องนี้เท่านั้น มีตัวกันชนไม่ให้ทับข้อมูลที่ใหม่กว่า */
(function (root) {
  'use strict';

  var KEY = 'fm_sync_v1';
  var API = 'https://api.github.com';
  var FILE = 'piithai-fm-career.json';
  var DESC = 'Piithai FM career save';

  function settings() {
    try { return JSON.parse(localStorage.getItem(KEY) || 'null') || {}; } catch (e) { return {}; }
  }
  function saveSettings(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); return true; } catch (e) { return false; }
  }
  function configured() { return !!settings().token; }

  function headers(token, withBody) {
    var h = {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
    if (withBody) h['Content-Type'] = 'application/json';
    return h;
  }

  function explain(res) {
    if (res.status === 401) return 'โทเค็นไม่ถูกต้องหรือหมดอายุ';
    if (res.status === 403 || res.status === 404) return 'โทเค็นไม่มีสิทธิ์ gist หรือไม่พบข้อมูล (' + res.status + ')';
    return 'GitHub ตอบกลับผิดปกติ (' + res.status + ')';
  }

  function req(f, url, opt) {
    return f(url, opt).catch(function () { throw new Error('เชื่อมต่อ GitHub ไม่ได้ (ตรวจสอบอินเทอร์เน็ต)'); });
  }

  /* หา Gist ที่เคยสร้างไว้จากเครื่องอื่น */
  function findExisting(s, f) {
    return req(f, API + '/gists?per_page=100', { headers: headers(s.token) }).then(function (res) {
      if (!res.ok) throw new Error(explain(res));
      return res.json();
    }).then(function (list) {
      for (var i = 0; i < list.length; i++) {
        if (list[i].files && list[i].files[FILE]) return list[i].id;
      }
      return null;
    });
  }

  /* อ่านเซฟบนคลาวด์ คืน null ถ้ายังไม่มี */
  function fetchRemote(s, f) {
    if (!s.gistId) return Promise.resolve(null);
    return req(f, API + '/gists/' + s.gistId, { headers: headers(s.token) }).then(function (res) {
      if (!res.ok) throw new Error(explain(res));
      return res.json();
    }).then(function (g) {
      var file = g.files && g.files[FILE];
      if (!file) return null;
      if (file.truncated && file.raw_url) {
        return req(f, file.raw_url, {}).then(function (r) { return r.text(); });
      }
      return file.content;
    }).then(function (content) {
      return content ? JSON.parse(content) : null;
    });
  }

  /* อัปโหลดเซฟขึ้นคลาวด์ opts.force = ทับแม้ข้อมูลบนคลาวด์ใหม่กว่า */
  function push(career, opts, fetchImpl) {
    opts = opts || {};
    var f = fetchImpl || root.fetch.bind(root), s = settings();
    if (!s.token) return Promise.reject(new Error('ยังไม่ได้ตั้งค่าโทเค็น GitHub'));

    var ready = s.gistId ? Promise.resolve(s.gistId) : findExisting(s, f);
    return ready.then(function (id) {
      s.gistId = id || null;
      return fetchRemote(s, f);
    }).then(function (remote) {
      if (remote && !opts.force && remote.saved_at && remote.saved_at > (s.lastSyncedAt || 0) && remote.saved_at !== career.saved_at) {
        var err = new Error('บนคลาวด์มีเซฟที่ใหม่กว่า (อาจมาจากอีกเครื่อง)');
        err.conflict = true; err.remoteSavedAt = remote.saved_at;
        throw err;
      }
      var body = { files: {} };
      body.files[FILE] = { content: JSON.stringify(career) };
      var url, method;
      if (s.gistId) { url = API + '/gists/' + s.gistId; method = 'PATCH'; }
      else { url = API + '/gists'; method = 'POST'; body.description = DESC; body.public = false; }
      return req(f, url, { method: method, headers: headers(s.token, true), body: JSON.stringify(body) });
    }).then(function (res) {
      if (!res.ok) throw new Error(explain(res));
      return res.json();
    }).then(function (g) {
      s.gistId = g.id || s.gistId;
      s.lastSyncedAt = career.saved_at;
      s.lastSyncClock = Date.now();
      saveSettings(s);
      return { ok: true, gistId: s.gistId };
    });
  }

  /* ดึงเซฟจากคลาวด์ คืน { career, saved_at } ผู้เรียกเป็นคนตัดสินใจว่าจะใช้ทับหรือไม่ */
  function pull(fetchImpl) {
    var f = fetchImpl || root.fetch.bind(root), s = settings();
    if (!s.token) return Promise.reject(new Error('ยังไม่ได้ตั้งค่าโทเค็น GitHub'));
    var ready = s.gistId ? Promise.resolve(s.gistId) : findExisting(s, f);
    return ready.then(function (id) {
      if (!id) throw new Error('ยังไม่พบเซฟบนคลาวด์ ให้อัปโหลดจากเครื่องหลักก่อน');
      s.gistId = id; saveSettings(s);
      return fetchRemote(s, f);
    }).then(function (remote) {
      if (!remote) throw new Error('ไม่พบไฟล์เซฟใน Gist');
      return { career: remote, saved_at: remote.saved_at || 0 };
    });
  }

  /* หลังนำเซฟจากคลาวด์มาใช้แล้ว บันทึกว่าตอนนี้ตรงกับคลาวด์ */
  function markSynced(savedAt) {
    var s = settings();
    s.lastSyncedAt = savedAt; s.lastSyncClock = Date.now();
    saveSettings(s);
  }

  var api = { settings: settings, saveSettings: saveSettings, configured: configured, push: push, pull: pull, markSynced: markSynced, FILE: FILE };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.FMSync = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* แปลงสแนปช็อตข้อมูลจริง (pl_2026_27.json) เป็นนักเตะ/สโมสรของเกม

(function (root) {
  'use strict';

  var FIRST_SEASON_YEAR = 2026;   /* ฤดูกาล 2026-27: สัญญาที่หมด 30 มิ.ย. 2027 = เหลือ 1 ปี */

  var ATTR_TH = {
    crossing: 'การครอสบอล', dribbling: 'การเลี้ยงบอล', finishing: 'การยิงประตู', first_touch: 'การจับบอลแรก',
    free_kicks: 'ลูกฟรีคิก', heading: 'การโหม่ง', long_shots: 'การยิงไกล', long_throws: 'การทุ่มไกล',
    marking: 'การประกบตัว', passing: 'การส่งบอล', penalties: 'ลูกจุดโทษ', tackling: 'การเข้าปะทะ',
    technique: 'เทคนิค', corners: 'ลูกเตะมุม',
    aggression: 'ความดุดัน', anticipation: 'การคาดการณ์', bravery: 'ความกล้า', composure: 'ความสงบ',
    concentration: 'สมาธิ', decisions: 'การตัดสินใจ', determination: 'ความมุ่งมั่น', flair: 'ลูกเล่น',
    leadership: 'ความเป็นผู้นำ', off_the_ball: 'การวิ่งหาตำแหน่ง', positioning: 'การยืนตำแหน่ง',
    teamwork: 'การทำงานเป็นทีม', vision: 'วิสัยทัศน์', work_rate: 'ความขยัน',
    acceleration: 'ความเร็วต้น', agility: 'ความคล่องตัว', balance: 'การทรงตัว', jumping: 'การกระโดด',
    natural_fitness: 'ความฟิต', pace: 'ความเร็ว', stamina: 'ความอึด', strength: 'ความแข็งแรง',
    aerial_reach: 'การออกรับลูกสูง', command_of_area: 'การคุมกรอบเขตโทษ', communication: 'การสื่อสาร',
    eccentricity: 'ความพลิกแพลง', handling: 'การรับบอล', kicking: 'การเตะบอล', one_on_ones: 'การดวลตัวต่อตัว',
    reflexes: 'ปฏิกิริยา', rushing_out: 'การพุ่งออกมา', punching: 'การชกบอล', throwing: 'การขว้างบอล',

  };
  var GROUPS = [
    ['เทคนิค', ['finishing', 'passing', 'dribbling', 'first_touch', 'technique', 'crossing', 'heading', 'long_shots', 'tackling', 'marking', 'free_kicks', 'penalties', 'corners', 'long_throws']],
    ['จิตใจ', ['decisions', 'composure', 'vision', 'positioning', 'anticipation', 'off_the_ball', 'work_rate', 'concentration', 'determination', 'teamwork', 'aggression', 'bravery', 'flair', 'leadership']],
    ['ร่างกาย', ['pace', 'acceleration', 'stamina', 'strength', 'agility', 'jumping', 'balance', 'natural_fitness']],
    ['ผู้รักษาประตู', ['handling', 'reflexes', 'one_on_ones', 'aerial_reach', 'command_of_area', 'communication', 'kicking', 'throwing', 'rushing_out', 'punching', 'eccentricity']],
    ['อื่นๆ', ['consistency', 'important_matches', 'injury_proneness', 'versatility']]
  ];
  var POS_TH = {
    GK: 'ผู้รักษาประตู', DC: 'กองหลังตัวกลาง', DL: 'แบ็กซ้าย', DR: 'แบ็กขวา', WBL: 'วิงแบ็กซ้าย', WBR: 'วิงแบ็กขวา',
    DM: 'กองกลางตัวรับ', MC: 'กองกลาง', ML: 'ปีกซ้าย(กลาง)', MR: 'ปีกขวา(กลาง)', AML: 'ปีกซ้าย', AMC: 'กองกลางตัวรุก',
    AMR: 'ปีกขวา', ST: 'กองหน้า'
  };

  function isSnapshot(o) {
    return !!o && !Array.isArray(o) && Array.isArray(o.players) && Array.isArray(o.teams) && o.players.length > 0 && o.teams.length >= 2;
  }

  function contractYears(end) {
    if (!end) return undefined;
    var y = +String(end).slice(0, 4);
    if (!y) return undefined;
    return Math.max(1, Math.min(5, y - FIRST_SEASON_YEAR));
  }

  function convert(snap) {
    var clubs = snap.teams.map(function (t) { return { id: t.id, name: t.name, short_name: t.short_name }; });
    var keys = [], seen = {};
    snap.players.forEach(function (p) {
      Object.keys(p.attrs || {}).forEach(function (k) { if (!seen[k]) { seen[k] = keys.length; keys.push(k); } });
    });
    var attrs = { keys: keys, a: {}, e: {} };
    var players = snap.players.map(function (p) {
      var st = p.season_stats || {}, at = p.attrs || {};
      var row = keys.map(function (k) { return at[k] == null ? null : at[k]; });
      attrs.a[p.id] = row;
      attrs.e[p.id] = (p.attrs_estimated || []).map(function (k) { return seen[k]; }).filter(function (i) { return i != null; });
      var out = {
        id: p.id, name: p.name, full_name: p.full_name || p.name, first_name: '', second_name: p.full_name || '',
        club_id: p.team_id, position: p.pos_fpl, pos_main: p.pos_main || p.pos_fpl,
        price: p.price, status: p.status === 'u' ? 'a' : (p.status || 'a'), news: p.news || '',
        minutes: st.minutes || 0, goals: st.goals_scored || 0, assists: st.assists || 0, clean_sheets: st.clean_sheets || 0, xg: 0, xa: 0,
        rating: p.ovr, ca: p.ca, pa: p.pa == null ? undefined : p.pa, age: p.age == null ? undefined : p.age,
        prone: at.injury_proneness == null ? undefined : at.injury_proneness

  /* ดึงค่าความสามารถของนักเตะหนึ่งคนเป็นรายการ [กลุ่ม, [[ชื่อ, ค่า, ประเมินหรือไม่]]] */
