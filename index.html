    store.keys.forEach(function (k, i) { idx[k] = i; });
    var out = [];
    GROUPS.forEach(function (g) {
      if (g[0] === 'ผู้รักษาประตู' && !isGK) return;
      var rows = [];
      g[1].forEach(function (k) {
        if (isGK && g[0] === 'เทคนิค' && ['passing', 'first_touch', 'technique'].indexOf(k) < 0) return;
        var i = idx[k];
        if (i == null || row[i] == null) return;
        if (!isGK && g[0] === 'เทคนิค' && ['free_kicks', 'penalties', 'corners', 'long_throws'].indexOf(k) >= 0 && row[i] <= 5) return;
        rows.push([ATTR_TH[k] || k, row[i], !!est[i]]);
      });
      if (rows.length) out.push([g[0], rows]);
    });
    if (isGK) out.sort(function (a, b) { return (b[0] === 'ผู้รักษาประตู') - (a[0] === 'ผู้รักษาประตู'); });
    return out;
  }

  var api = { isSnapshot: isSnapshot, convert: convert, profile: profile, ATTR_TH: ATTR_TH, POS_TH: POS_TH, contractYears: contractYears };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.FMSnapshot = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* วาดแมตช์ 2D บน Canvas จากผลของเอนจิน (หน่วยในสนามเป็นเมตร 105 x 68) */
(function (root) {
  'use strict';

  var W = 105, H = 68, PAD = 3;

  function hash(n) {
    var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function lerp(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }
  function ease(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function PitchView(canvas) {
    this.c = canvas;
    this.ctx = canvas.getContext('2d');
    this.match = null;
    this.flash = null;
    this.resize();
  }

  PitchView.prototype.resize = function () {
    var dpr = root.devicePixelRatio || 1;
    var w = this.c.clientWidth || 640;
    var h = w * (H + 2 * PAD) / (W + 2 * PAD);
    this.c.width = Math.round(w * dpr);
    this.c.height = Math.round(h * dpr);
    this.c.style.height = h + 'px';
    this.scale = w / (W + 2 * PAD);
    this.dpr = dpr;
    this.showNames = w >= 680;
  };

  /* match = { home:{xi,color}, away:{xi,color}, result } */
  PitchView.prototype.setMatch = function (match) {
    this.match = match;
    this.flash = null;
    var res = match.result, total = res.total;
    var byMinute = {};
    res.events.forEach(function (e) { if (e.attack) byMinute[e.minute] = e; });

    var keys = [null];
    var nextStart = { x: 52.5, y: 34 };
    for (var m = 1; m <= total; m++) {
      var ev = byMinute[m];
      var S = nextStart, k;
      if (ev) {
        var dir = ev.side === 'home' ? 1 : -1;
        var P = { x: dir > 0 ? 86 + hash(m) * 6 : 19 - hash(m) * 6, y: 34 + (hash(m * 3) - 0.5) * 26 };
        var G = { x: dir > 0 ? W : 0, y: 34 + (hash(m * 5) - 0.5) * 5 };
        var end;
        if (ev.type === 'goal') end = { x: dir > 0 ? W + 2.2 : -2.2, y: G.y };
        else if (ev.type === 'save') end = { x: G.x - dir * 6, y: 34 + (hash(m * 9) - 0.5) * 12 };
        else end = { x: G.x + dir * 3, y: G.y + (hash(m * 11) > 0.5 ? 1 : -1) * (7 + hash(m * 13) * 6) };
        k = { ev: ev, S: S, P: P, G: G, end: end };
        nextStart = ev.type === 'goal' ? { x: 52.5, y: 34 } : end;
      } else {
        var d2 = res.possession[m] === 'home' ? 1 : -1;
        var P2 = { x: 52.5 + d2 * (8 + hash(m) * 14), y: 34 + (hash(m * 7) - 0.5) * 40 };
        k = { ev: null, S: S, P: P2, end: P2 };
        nextStart = P2;
      }
      keys.push(k);
    }
    this.keys = keys;
  };

  PitchView.prototype.ballAt = function (t) {
    var total = this.match.result.total;
    t = clamp(t, 0, total - 0.0001);
    var m = Math.floor(t) + 1, u = t - (m - 1), k = this.keys[m], p;
    if (k.ev) {
      if (u < 0.6) p = lerp(k.S, k.P, ease(u / 0.6));
      else if (u < 0.85) p = lerp(k.P, k.G, (u - 0.6) / 0.25);
      else p = lerp(k.G, k.end, ease((u - 0.85) / 0.15));
    } else {
      p = lerp(k.S, k.P, ease(u));
    }
    return p;
  };

  PitchView.prototype.positions = function (sideName, ball, t) {
    var side = this.match[sideName];
    var dir = sideName === 'home' ? 1 : -1;
    var m = clamp(Math.floor(t) + 1, 1, this.match.result.total);
    var hasBall = this.match.result.possession[m] === sideName;
    var out = [], i, s, x, y, push;
    for (i = 0; i < side.xi.length; i++) {
      s = side.xi[i];
      x = sideName === 'home' ? s.x : W - s.x;
      y = sideName === 'home' ? s.y : H - s.y;
      var gk = s.pos === 'GK';
      push = hasBall && !gk ? dir * 4 : 0;
      x += (ball.x - W / 2) * (gk ? 0.08 : 0.4) + push;
      y += (ball.y - H / 2) * (gk ? 0.12 : 0.25);
      x += Math.sin(t * 1.7 + i * 1.3) * 0.9;
      y += Math.cos(t * 1.3 + i * 2.1) * 0.9;
      out.push({ x: clamp(x, 1, W - 1), y: clamp(y, 1, H - 1), slot: s });
    }
    if (hasBall) {
      var best = -1, bd = 1e9;
      for (i = 1; i < out.length; i++) {
        var dx = out[i].x - ball.x, dy = out[i].y - ball.y, d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = i; }
      }
      if (best > 0) {
        out[best].x = clamp(ball.x - dir * 1.3, 1, W - 1);
        out[best].y = clamp(ball.y, 1, H - 1);
      }
    }
    return out;
  };

  PitchView.prototype.showGoal = function (text) {
    this.flash = { text: text, until: Date.now() + 2400 };
  };

  PitchView.prototype.drawPitch = function (ctx) {
    var i;
    ctx.fillStyle = '#1f7a3a';
    ctx.fillRect(-PAD, -PAD, W + 2 * PAD, H + 2 * PAD);
    for (i = 0; i < 10; i++) {
      ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.035)';
      ctx.fillRect(i * W / 10, 0, W / 10, H);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 0.35;
    ctx.strokeRect(0, 0, W, H);
    ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 9.15, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 0.5, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
    ctx.strokeRect(0, (H - 40.3) / 2, 16.5, 40.3);
    ctx.strokeRect(W - 16.5, (H - 40.3) / 2, 16.5, 40.3);
    ctx.strokeRect(0, (H - 18.3) / 2, 5.5, 18.3);
    ctx.strokeRect(W - 5.5, (H - 18.3) / 2, 5.5, 18.3);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(-2.4, (H - 7.32) / 2, 2.4, 7.32);
    ctx.fillRect(W, (H - 7.32) / 2, 2.4, 7.32);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.strokeRect(-2.4, (H - 7.32) / 2, 2.4, 7.32);
    ctx.strokeRect(W, (H - 7.32) / 2, 2.4, 7.32);
  };

  PitchView.prototype.draw = function (t) {
    var ctx = this.ctx, k = this.dpr * this.scale;
    ctx.setTransform(k, 0, 0, k, PAD * k, PAD * k);
    this.drawPitch(ctx);
    if (!this.match) return;

    var ball = this.ballAt(t);
    var sides = ['home', 'away'], si, i;
    var gkColors = { home: '#f4d03f', away: '#58d68d' };
    for (si = 0; si < 2; si++) {
      var name = sides[si], pos = this.positions(name, ball, t), color = this.match[name].color;
      for (i = 0; i < pos.length; i++) {
        var p = pos[i], isGk = p.slot.pos === 'GK';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.9, 0, Math.PI * 2);
        ctx.fillStyle = isGk ? gkColors[name] : color;
        ctx.fill();
        ctx.lineWidth = 0.3;
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.stroke();
        ctx.fillStyle = isGk ? '#222' : '#fff';
        ctx.font = 'bold 2.3px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(i === 0 ? 1 : i + 1), p.x, p.y + 0.1);
        if (this.showNames) {
          var nm = String(p.slot.player.name || '').split(' ').pop();
          ctx.font = '1.7px system-ui, sans-serif';
          ctx.fillStyle = 'rgba(255,255,255,0.92)';
          ctx.fillText(nm, p.x, p.y + 3);
        }
      }
    }

    ctx.beginPath();
    ctx.arc(ball.x + 0.3, ball.y + 0.4, 0.95, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 0.95, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.lineWidth = 0.15;
    ctx.strokeStyle = '#222';
    ctx.stroke();

    if (this.flash && Date.now() < this.flash.until) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(W / 2 - 30, H / 2 - 7, 60, 14);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 5px system-ui, sans-serif';
      ctx.fillText('GOAL!', W / 2, H / 2 - 2);
      ctx.font = '3px system-ui, sans-serif';
      ctx.fillText(this.flash.text, W / 2, H / 2 + 3.5);
    }
  };

  root.PitchView = PitchView;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ส่วนหน้าจอและการควบคุมเกม */
(function () {
  'use strict';

  var E = window.FMEngine, PitchView = window.PitchView;
  var STORE_KEY = 'fm_data_v1';
  var BASE_MIN_PER_SEC = 6;   /* 1x: 6 นาทีเกมต่อ 1 วินาที */
  var SLOW_FACTOR = 0.15;     /* นาทีที่มีจังหวะยิงเล่นช้าลง */

  var state = { clubs: [], players: [], match: null, view: null, t: 0, speed: 1, playing: false, lastTs: 0, shown: 0, score: { home: 0, away: 0 } };
  function $(id) { return document.getElementById(id); }

  function clubColor(club, avoidHue) {
    var h = 0, s = club.name + club.short_name;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    if (avoidHue != null) {
      var d = Math.abs(h - avoidHue); d = Math.min(d, 360 - d);
      if (d < 50) h = (h + 140) % 360;
    }
    return { hue: h, css: 'hsl(' + h + ',68%,42%)' };
  }

  /* รูปจากโฟลเดอร์ในเครื่อง ถ้าไม่มีไฟล์จะแสดงตัวย่อ/สีแทน */
  function imgOrFallback(src, fallbackText, bg, cls) {
    var wrap = document.createElement('span');
    wrap.className = 'avatar ' + (cls || '');
    wrap.style.background = bg;
    wrap.textContent = fallbackText;
    var img = new Image();
    img.onload = function () { wrap.textContent = ''; wrap.style.background = 'transparent'; wrap.appendChild(img); };
    img.src = src;
    return wrap;
  }

  /* ---------- ข้อมูล ---------- */
  function validData(players, clubs) {
    return Array.isArray(players) && Array.isArray(clubs) && players.length > 0 && clubs.length >= 2 &&
      players[0].club_id !== undefined && players[0].rating !== undefined && clubs[0].short_name !== undefined;
  }

  var attrStore = null;   /* ค่าความสามารถรายด้านของนักเตะ (จากสแนปช็อต) เก็บแยกจากเซฟอาชีพ */

  function setData(players, clubs, label, attrs) {
    state.players = players;
    attrStore = attrs || null;
    state.clubs = clubs.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    ['homeSel', 'awaySel'].forEach(function (id, idx) {
      var sel = $(id);
      sel.innerHTML = '';
      state.clubs.forEach(function (c) {
        var o = document.createElement('option');
        o.value = c.id; o.textContent = c.name;
        sel.appendChild(o);
      });
      sel.selectedIndex = Math.min(idx, state.clubs.length - 1);
    });
    $('dataStatus').textContent = label + ' · ' + clubs.length + ' ทีม · ' + players.length + ' นักเตะ';
    updateBadges();
    dataListeners.forEach(function (cb) { cb(); });
  }

  function loadFromFiles(files) {
    var jobs = Array.prototype.map.call(files, function (f) {
      return f.text().then(function (t) { return JSON.parse(t); });
    });
    Promise.all(jobs).then(function (parts) {
      var players = null, clubs = null;
      var snap = parts.filter(function (p) { return window.FMSnapshot.isSnapshot(p); })[0];
      if (snap) {
        var c = window.FMSnapshot.convert(snap);
        var lbl = 'ข้อมูลจริง ' + (c.meta.league || '') + ' ' + (c.meta.season || '') + ' (' + (c.meta.snapshot_date || '') + ')';
        setData(c.players, c.clubs, lbl, c.attrs);
        try { localStorage.setItem(STORE_KEY, JSON.stringify({ players: c.players, clubs: c.clubs, attrs: c.attrs, label: lbl })); }
        catch (e) { $('dataStatus').textContent += ' (บันทึกไว้ในเครื่องไม่ได้ ต้องโหลดไฟล์ใหม่ทุกครั้ง)'; }
        return;
      }
      parts.forEach(function (p) {
        if (!Array.isArray(p) || !p.length) return;
        if (p[0].club_id !== undefined) players = p;
        else if (p[0].short_name !== undefined) clubs = p;
      });
      if (!validData(players, clubs)) { $('dataStatus').textContent = 'ไฟล์ไม่ถูกต้อง: เลือก pl_2026_27.json หรือเลือก players.json และ clubs.json พร้อมกัน'; return; }
      setData(players, clubs, 'ข้อมูลจากไฟล์ของคุณ');
      try { localStorage.setItem(STORE_KEY, JSON.stringify({ players: players, clubs: clubs })); } catch (e) { /* ไม่เป็นไร */ }
    }).catch(function () { $('dataStatus').textContent = 'อ่านไฟล์ไม่สำเร็จ'; });
  }

  function initData() {
    var sample = E.makeSampleData();
    setData(sample.players, sample.clubs, 'ข้อมูลตัวอย่าง (สมมติ)');
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { stored = null; }
    if (stored && validData(stored.players, stored.clubs)) setData(stored.players, stored.clubs, stored.label || 'ข้อมูลที่เคยโหลดไว้', stored.attrs);
    fetch('data/pl_2026_27.json').then(function (r) {
      if (!r.ok) throw new Error('no snapshot');
      return r.json();
    }).then(function (j) {
      if (!window.FMSnapshot.isSnapshot(j)) throw new Error('bad snapshot');
      var c = window.FMSnapshot.convert(j);
      setData(c.players, c.clubs, 'ข้อมูลจริง ' + (c.meta.season || '') + ' จากโฟลเดอร์ data', c.attrs);
    }).catch(function () {
      return Promise.all([fetch('data/players.json'), fetch('data/clubs.json')]).then(function (rs) {
        if (!rs[0].ok || !rs[1].ok) throw new Error('no data');
        return Promise.all([rs[0].json(), rs[1].json()]);
      }).then(function (d) {
        if (validData(d[0], d[1])) setData(d[0], d[1], 'ข้อมูลจากโฟลเดอร์ data');
      }).catch(function () { /* ไม่มีโฟลเดอร์ data ก็ใช้ที่มีอยู่ */ });
    });
  }

  /* ---------- หน้าจอ ---------- */
  function clubById(id) { return state.clubs.filter(function (c) { return String(c.id) === String(id); })[0]; }

  function setBadge(el, club) {
    el.innerHTML = '';
    if (!club) return;
    var col = clubColor(club).css;
    el.appendChild(imgOrFallback('assets/clubs/' + club.short_name + '.png', club.short_name, col, 'cbadge'));
  }

  function updateBadges(homeClub, awayClub) {
    var h = homeClub || clubById($('homeSel').value), a = awayClub || clubById($('awaySel').value);
    setBadge($('badgeHome'), h); setBadge($('badgeAway'), a);
    $('nameHome').textContent = h ? h.name : '';
    $('nameAway').textContent = a ? a.name : '';
  }

  function renderLineups() {
    var m = state.match;
    [['home', 'lineHome'], ['away', 'lineAway']].forEach(function (pair) {
      var side = m[pair[0]], el = $(pair[1]);
      el.innerHTML = '<h2>' + side.club.name + ' (' + side.formation + ')</h2>';
      side.xi.forEach(function (s) {
        var p = s.player, row = document.createElement('div');
        row.className = 'prow';
        row.appendChild(imgOrFallback('assets/players/' + p.id + '.png', String(p.name).slice(0, 2).toUpperCase(), side.color, 'face'));
        var info = document.createElement('span');
        info.className = 'pinfo';
        info.textContent = p.name;
        var meta = document.createElement('span');
        meta.className = 'pmeta';
        meta.textContent = s.pos + ' · ' + p.rating;
        row.appendChild(info); row.appendChild(meta);
        el.appendChild(row);
      });
    });
  }

  function addLog(text, cls) {
    var li = document.createElement('li');
    li.textContent = text;
    li.className = 'fe' + (cls ? ' ' + cls : '');
    var log = $('log');
    log.insertBefore(li, log.firstChild);
  }

  function describe(e) {
    var m = state.match, team = m[e.side].club.name, opp = m[e.side === 'home' ? 'away' : 'home'].club.name;
    if (window.FMNarrative) {
      return window.FMNarrative.eventLine(e, { team: team, opp: opp, sf: state.score[e.side], sa: state.score[e.side === 'home' ? 'away' : 'home'] });
    }
    switch (e.type) {
      case 'goal': return ['' + e.minute + "' ประตู! " + e.player.name + ' (' + team + ')' + (e.assist ? ' จ่ายโดย ' + e.assist.name : ''), 'goal'];
      case 'save': return ['' + e.minute + "' " + e.gk.name + ' (' + opp + ') เซฟลูกยิงของ ' + e.player.name, ''];
      case 'miss': return ['' + e.minute + "' " + e.player.name + ' (' + team + ') ยิงไม่เข้ากรอบ', ''];
      case 'yellow': return ['' + e.minute + "' " + e.player.name + ' (' + team + ') โดนใบเหลือง', ''];
      case 'red': return ['' + e.minute + "' " + e.player.name + ' (' + team + ') โดนใบแดง', 'goal'];
    }
    return ['', ''];
  }

  function updateScore() {
    $('sbScore').textContent = state.score.home + ' - ' + state.score.away;
  }
  function updateClock() {
    var res = state.match.result, minute = Math.min(res.total, Math.floor(state.t) + 1);
    $('sbMin').textContent = state.t >= res.total ? 'จบเกม' : (minute > 90 ? '90+' + (minute - 90) : minute) + "'";
  }

  function processEvents() {
    var res = state.match.result;
    while (state.shown < res.events.length && res.events[state.shown].reveal <= state.t) {
      var e = res.events[state.shown++];
      if (e.type === 'goal') { state.score[e.side]++; updateScore(); }
      var d = describe(e);
      addLog(d[0], d[1]);
      if (e.type === 'goal') {
        state.view.showGoal(e.player.name + ' (' + state.match[e.side].club.short_name + ') ' + e.minute + "'");
      }
    }
  }

  function showStats() {
    var r = state.match.result, s = r.stats;
    function row(label, a, b) { return '<tr><td>' + a + '</td><th>' + label + '</th><td>' + b + '</td></tr>'; }
    $('stats').innerHTML = '<table>' +
      row('ยิงทั้งหมด', s.home.shots, s.away.shots) +
      row('ยิงตรงกรอบ', s.home.onTarget, s.away.onTarget) +
      row('ครองบอล', r.possessionPct.home + '%', r.possessionPct.away + '%') +
      row('ใบเหลือง', s.home.yellow, s.away.yellow) +
      (s.home.red + s.away.red ? row('ใบแดง', s.home.red, s.away.red) : '') + '</table>';
  }

  function finish() {
    state.playing = false;
    state.score = { home: state.match.result.score.home, away: state.match.result.score.away };
    updateScore(); updateClock(); showStats();
    $('startBtn').textContent = 'เล่นแมตช์ใหม่';
    if (state.onFinish) {
      var cb = state.onFinish;
      state.onFinish = null;
      cb(state.match.result);
    }
  }

  function loop(ts) {
    if (!state.playing) return;
    var res = state.match.result;
    var dt = state.lastTs ? Math.min(0.1, (ts - state.lastTs) / 1000) : 0;
    state.lastTs = ts;
    var m = Math.min(res.total, Math.floor(state.t) + 1);
    var inAttack = state.view.keys[m] && state.view.keys[m].ev;
    var rate = BASE_MIN_PER_SEC * state.speed * (inAttack ? SLOW_FACTOR : 1);
    state.t = Math.min(res.total, state.t + dt * rate);
    processEvents();
    state.view.draw(state.t);
    updateClock();
    if (state.t >= res.total) { finish(); state.view.draw(res.total); return; }
    requestAnimationFrame(loop);
  }

  function startMatch(skip) {
    var hid = $('homeSel').value, aid = $('awaySel').value;
    if (hid === aid) { $('dataStatus').textContent = 'เลือกสองทีมที่ต่างกัน'; return; }
    runMatch(hid, aid, $('homeForm').value, $('awayForm').value, { skip: skip });
  }

  /* เล่นแมตช์ระหว่างสองสโมสร: opts = { skip, players (ถ้าไม่ใส่ใช้ข้อมูลหลัก), homeXI/awayXI (ตัวจริงที่จัดไว้แล้ว), sim (ตัวเลือกเอนจิน), onFinish(result) } */
  function runMatch(hid, aid, hf, af, opts) {
    opts = opts || {};
    var skip = opts.skip, pool = opts.players || state.players;
    state.onFinish = opts.onFinish || null;
    var hc = clubById(hid), ac = clubById(aid);
    var hp = pool.filter(function (p) { return String(p.club_id) === String(hid); });
    var ap = pool.filter(function (p) { return String(p.club_id) === String(aid); });
    var hxi = opts.homeXI || E.pickLineup(hp, hf), axi = opts.awayXI || E.pickLineup(ap, af);
    var res = E.simulate(hxi, axi, opts.sim || {});
    var hcol = clubColor(hc), acol = clubColor(ac, hcol.hue);

    state.match = { home: { xi: hxi, club: hc, color: hcol.css, formation: hf }, away: { xi: axi, club: ac, color: acol.css, formation: af }, result: res };
    if (!state.view) state.view = new PitchView($('pitch'));
    state.view.resize();
    state.view.setMatch(state.match);
    state.t = 0; state.shown = 0; state.score = { home: 0, away: 0 }; state.lastTs = 0;
    $('log').innerHTML = ''; $('stats').innerHTML = '';
    updateScore(); updateBadges(hc, ac); renderLineups();
    if (skip) {
      state.t = res.total;
      processEvents();
      state.view.draw(res.total);
      finish();
      return;
    }
    state.playing = true;
    $('startBtn').textContent = 'กำลังแข่ง...';
    try { $('pitch').scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { /* ไม่เป็นไร */ }
    requestAnimationFrame(loop);
  }

  function init() {
    Object.keys(E.FORMATIONS).forEach(function (f) {
      ['homeForm', 'awayForm'].forEach(function (id) {
        var o = document.createElement('option'); o.value = f; o.textContent = f; $(id).appendChild(o);
      });
    });
    initData();
    $('homeSel').addEventListener('change', function () { updateBadges(); });
    $('awaySel').addEventListener('change', function () { updateBadges(); });
    $('startBtn').addEventListener('click', function () { if (!state.playing) startMatch(false); });
    $('skipBtn').addEventListener('click', function () { state.playing = false; startMatch(true); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-speed]'), function (b) {
      b.addEventListener('click', function () {
        state.speed = +b.getAttribute('data-speed');
        Array.prototype.forEach.call(document.querySelectorAll('[data-speed]'), function (x) {
          x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
        });
      });
    });
    $('fileInput').addEventListener('change', function (e) { if (e.target.files.length) loadFromFiles(e.target.files); });
    $('clearBtn').addEventListener('click', function () {
      try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ไม่เป็นไร */ }
      var s = E.makeSampleData(); setData(s.players, s.clubs, 'ข้อมูลตัวอย่าง (สมมติ)');
    });
    window.addEventListener('resize', function () {
      if (state.view) { state.view.resize(); state.view.draw(state.t); }
    });
    state.view = new PitchView($('pitch'));
    state.view.draw(0);
  }

  /* ให้โหมดอาชีพ (career_ui.js) เรียกใช้ */
  var dataListeners = [];
  window.FMApp = {
    runMatch: runMatch,
    imgOrFallback: imgOrFallback,
    clubColor: clubColor,
    getPlayers: function () { return state.players; },
    getClubs: function () { return state.clubs; },
    getAttrs: function () { return attrStore; },
    isPlaying: function () { return state.playing; },
    skipNow: function () {
      if (!state.playing || !state.match) return;
      var res = state.match.result;
      state.t = res.total; processEvents(); state.view.draw(res.total); finish();
    },
    resizePitch: function () { if (state.view) { state.view.resize(); state.view.draw(state.t); } },
    onData: function (cb) { dataListeners.push(cb); }
  };

  document.addEventListener('DOMContentLoaded', init);
})();

</script>
<script>
/* หน้าจอหลักของเกมตามสเปก UX/UI (claude/ui-spec.md): เมนูข้าง แถบหัว และหน้าจอส่วนแรก

(function () {

<script>

      '<label class="l">โทเค็น GitHub<input id="tokIn" class="inp" type="password" autocomplete="off" placeholder="' + (ys.token ? '•••••• (บันทึกแล้ว)' : 'วางโทเค็น') + '"></label><div class="pills"><button type="button" class="btn sm" data-a="savetoken">บันทึกโทเค็น</button>' + (ys.token ? '<button type="button" class="btn sm" data-a="deltoken">ลบโทเค็น</button>' : '') + '</div>' +
      (ys.token ? '<label class="chk"><input type="checkbox" id="autoSync"' + (ys.auto ? ' checked' : '') + ' data-a="autosync"> อัปโหลดอัตโนมัติทุกครั้งที่บันทึก</label><div class="pills"><button type="button" class="btn" data-a="pushnow">อัปโหลดขึ้นคลาวด์</button><button type="button" class="btn" data-a="cloudpull">ดึงจากคลาวด์</button></div>' : '') + syncBox() + '</section>';
    h += '<section class="card"><h2>AI เขียนข่าวและรายงาน (ไม่บังคับ)</h2><div class="sub">ถ้าไม่ตั้งค่า เกมใช้รายงานมาตรฐานที่ทำงานออฟไลน์ ถ้าใส่คีย์ Anthropic API ของคุณเอง ระบบจะเรียก Claude จากเครื่องนี้ตรงๆ (มีค่าใช้จ่ายตามการใช้งาน) คีย์เก็บในเครื่องนี้เท่านั้น ข้อความที่มีชื่อหรือตัวเลขนอกข้อมูลเกมจะถูกตัดทิ้ง</div>' +
      '<label class="l">คีย์ API<input id="aiKey" class="inp" type="password" autocomplete="off" placeholder="' + (as.key ? '•••••• (บันทึกแล้ว)' : 'sk-ant-...') + '"></label>' +
      '<label class="l">ชื่อโมเดล<input id="aiModel" class="inp" type="text" value="' + esc(as.model || N.DEFAULT_MODEL) + '"></label>' +
      '<label class="chk"><input type="checkbox" id="aiAuto"' + (as.auto ? ' checked' : '') + '> ให้ AI เขียนรายงานอัตโนมัติหลังจบนัด</label>' +
      '<div class="pills"><button type="button" class="btn sm" data-a="saveai">บันทึกการตั้งค่า AI</button><button type="button" class="btn sm" data-a="delai">ลบคีย์ AI</button></div></section>';
    h += '<div data-mount="dataPane"></div>';
    h += '<section class="card"><h2>อื่นๆ</h2><div class="pills"><button type="button" class="btn" data-a="go" data-s="single">แมตช์เดี่ยว (เล่นเร็ว ไม่บันทึกผล)</button><button type="button" class="btn danger" data-a="resetask">เริ่มอาชีพใหม่</button></div></section>';
    return h + '</div>';
  };
  SCREENS.single = function () { return '<div data-mount="singlePane"></div><div data-mount="matchPane" style="margin-top:18px"></div>'; };

  function b64(s) { return btoa(unescape(encodeURIComponent(s))); }
  function unb64(s) { return decodeURIComponent(escape(atob(s))); }
  ACT.download = function () {
    var g = G(), url = URL.createObjectURL(new Blob([JSON.stringify(g)], { type: 'application/json' })), a = document.createElement('a');
    a.href = url; a.download = 'piithai-fm-career-' + g.season + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  };
  ACT.copycode = function () {
    var code = b64(JSON.stringify(G()));
    var done = function () { toast('คัดลอกรหัสเซฟแล้ว'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, function () { fallbackCopy(code); });
    else fallbackCopy(code);
  };
  function fallbackCopy(code) { var ta = $('#saveCode'); if (!ta) return; ta.value = code; ta.select(); try { document.execCommand('copy'); toast('คัดลอกรหัสเซฟแล้ว'); } catch (e) { toast('คัดลอกไม่ได้ ให้กดค้างที่ช่องแล้วคัดลอกเอง'); } }
  ACT.importcode = function () {
    var ta = $('#saveCode'); if (!ta || !ta.value.trim()) { toast('วางรหัสเซฟก่อน'); return; }
    try {
      var obj = JSON.parse(unb64(ta.value.trim()));
      if (!S.isValid(obj)) throw new Error('bad');
      X.applyLoaded(obj, 'นำเข้ารหัสเซฟสำเร็จ'); X.render();
    } catch (e) { toast('รหัสเซฟไม่ถูกต้อง'); }
  };
  ACT.savemgr = function () { var v = ($('#mgrSet').value || '').trim(); if (!v) return; G().manager = v; save(); toast('บันทึกชื่อแล้ว'); X.rerender(); };
  ACT.savetoken = function () {
    var v = ($('#tokIn').value || '').trim(); if (!v) return;
    var s = Y.settings(); s.token = v; s.gistId = null; s.lastSyncedAt = 0; Y.saveSettings(s); U.syncMsg = { ok: true, msg: 'บันทึกโทเค็นแล้ว' }; X.rerender();
  };
  ACT.deltoken = function () { Y.saveSettings({}); U.syncMsg = { ok: true, msg: 'ลบโทเค็นแล้ว' }; X.rerender(); };
  ACT.autosync = function (t) { var s = Y.settings(); s.auto = t.checked; Y.saveSettings(s); };
  ACT.pushnow = function () { X.doPush(false, false); };
  ACT.pushforce = function () { X.doPush(true, false); };
  ACT.cloudpull = function () { X.cloudPull(); };
  ACT.usecloud = function () { var r = U.pendingCloud; X.applyLoaded(r.career, 'ใช้เซฟจากคลาวด์แล้ว'); Y.markSynced(r.saved_at); U.pendingCloud = null; U.syncMsg = null; X.render(); };
  ACT.cancelcloud = function () { U.pendingCloud = null; U.syncMsg = null; X.rerender(); };
  ACT.saveai = function () {
    var s = N.aiSettings(), k = ($('#aiKey').value || '').trim();
    if (k) s.key = k;
    s.model = ($('#aiModel').value || '').trim() || N.DEFAULT_MODEL; s.auto = $('#aiAuto').checked;
    N.saveAiSettings(s); toast('บันทึกการตั้งค่า AI แล้ว'); X.rerender();
  };
  ACT.delai = function () { N.saveAiSettings({}); toast('ลบคีย์ AI แล้ว'); X.rerender(); };
  ACT.resetask = function () {
    X.modal('<h2 style="margin:0 0 8px">เริ่มอาชีพใหม่?</h2><p class="sub">เซฟปัจจุบันในเครื่องนี้จะถูกลบและกู้คืนไม่ได้ (เว้นแต่คุณดาวน์โหลดหรืออัปโหลดสำรองไว้แล้ว)</p><div class="pills"><button type="button" class="btn danger" data-a="resetgo">ลบและเริ่มใหม่</button><button type="button" class="btn" data-a="mclose">ยกเลิก</button></div>');
  };
  ACT.resetgo = function () {
    X.closeModal(); X.G = null; try { localStorage.removeItem(X.KEY); } catch (e) { /* ไม่เป็นไร */ }
    U.screen = 'newgame'; U.post = null; U.matchPhase = 'pre'; U.newClub = null; U.syncMsg = null; X.render();
  };

  /* ไฟล์เซฟที่เลือกจากเครื่อง (ใช้ทั้งหน้าเริ่มเกมและหน้าตั้งค่า) */
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.id === 'saveFile' && t.files && t.files[0]) {
      t.files[0].text().then(function (txt) {
        var obj = JSON.parse(txt);
        if (!S.isValid(obj)) throw new Error('bad');
        X.applyLoaded(obj, 'โหลดเซฟสำเร็จ'); X.render();
      }).catch(function () { toast('ไฟล์เซฟไม่ถูกต้อง'); });
    }
    if (t && t.getAttribute && t.getAttribute('data-a') === 'autosync') ACT.autosync(t);
  });

  /* ตัวติดตั้งแอป: ปุ่ม "เข้าใจแล้ว" (pwa.js เป็นตัวตัดสินว่าจะแสดงเมื่อไร) */
  /* ---------- เริ่มต้นแอป ---------- */
  document.addEventListener('DOMContentLoaded', function () {
    X.load();
    X.render();
    App.onData(function () { if (!G() && U.screen !== 'single') X.rerender(); });
  });
})();

</script>
<script>
/* PWA: ลงทะเบียน service worker และแสดงคำแนะนำติดตั้งบน iPhone/iPad */
(function () {
  'use strict';

  var HINT_KEY = 'fm_install_hint_dismissed';

  function isStandalone() {
    return window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }
  function isIOS() {
    return /iPhone|iPad|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); /* iPadOS ที่ขอเว็บแบบเดสก์ท็อป */
  }

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* ใช้งานต่อได้แม้ลงทะเบียนไม่สำเร็จ */ });
    });
  }

  /* ขอให้เบราว์เซอร์เก็บเซฟเกมไว้ไม่ให้ถูกล้างเอง (ถ้าทำได้) */
  if (isStandalone() && navigator.storage && navigator.storage.persist) {
    try { navigator.storage.persist(); } catch (e) { /* ไม่เป็นไร */ }
  }

  document.addEventListener('DOMContentLoaded', function () {
    var box = document.getElementById('installHint');
    if (!box || isStandalone() || !isIOS()) return;
    try { if (localStorage.getItem(HINT_KEY)) return; } catch (e) { /* แสดงต่อไป */ }
    box.style.display = '';
    document.getElementById('installHintClose').addEventListener('click', function () {
      box.style.display = 'none';
      try { localStorage.setItem(HINT_KEY, '1'); } catch (e) { /* ไม่เป็นไร */ }
    });
  });
})();

</script>
